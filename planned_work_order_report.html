<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .production-report-wrapper {
            max-height: 80vh;
            overflow: auto;
            border: 1px solid #dce3eb;
            border-radius: 8px;
        }

        .production-table {
            /* min-width: 1250px; */
            margin-bottom: 0;
            font-size: 11px;
        }

        .production-table thead th {
            position: sticky;
            top: 0;
            z-index: 5;
            background: #eaf2ff;
            color: #344563;
            font-weight: 700;
            padding: 11px 9px;
            white-space: nowrap;
            border-bottom: 2px solid #cbd7e8;
        }

        .production-table tbody td {
            padding: 9px;
            vertical-align: middle;
            background: #fff;
        }

        .production-table tbody tr:hover>td {
            background: #f7faff;
        }

        .godown-title {
            font-weight: 700;
            color: #1e3a5f;
            font-size: 13px;
        }

        .godown-sub {
            margin-top: 5px;
            font-size: 11px;
            color: #64748b;
        }

        .godown-badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 7px;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 5px;
        }

        .planner-name {
            font-weight: 700;
            color: #334155;
        }

        .planner-date {
            margin-top: 5px;
            color: #64748b;
            font-size: 11px;
        }

        .order-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 6px;
        }

        .order-card:last-child {
            margin-bottom: 0;
        }

        .order-title {
            color: #2563eb;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .order-customer {
            font-weight: 700;
            color: #334155;
        }

        .order-meta {
            color: #64748b;
            font-size: 11px;
            margin-top: 4px;
            line-height: 1.6;
        }

        .order-qty {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            font-weight: 700;
            border-radius: 4px;
            padding: 3px 7px;
        }

        .process-card {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 7px;
            overflow: hidden;
        }

        .process-card:last-child {
            margin-bottom: 0;
        }

        .process-heading {
            padding: 7px 9px;
            background: #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .process-name {
            color: #1e40af;
            font-weight: 700;
            font-size: 12px;
        }

        .process-part {
            padding: 7px 9px;
            font-weight: 600;
            color: #475569;
            border-bottom: 1px solid #edf0f4;
        }

        .process-wo {
            padding: 7px 9px;
            background: #fff;
        }

        .wo-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 12px;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px dashed #e2e8f0;
        }

        .wo-row:last-child {
            border-bottom: 0;
        }

        .wo-id {
            color: #2563eb;
            font-weight: 700;
        }

        .wo-qty {
            color: #15803d;
            font-weight: 700;
        }

        .wo-pending {
            color: #d97706;
            font-weight: 600;
        }

        .wo-date {
            color: #64748b;
        }

        .process-count {
            background: #dbeafe;
            color: #1e40af;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 10px;
            font-weight: 700;
        }

        .report-empty {
            color: #94a3b8;
            font-style: italic;
        }

        .production-filter-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 12px;
        }

        .production-filter-card .card-body {
            padding: 12px;
        }

        .filter-control {
            height: 36px;
            min-height: 36px;
            font-size: 12px;
            border: 1px solid #dce3eb;
            border-radius: 6px;
            background-color: #fff;
            color: #334155;
            padding: 5px 9px;
            width: 100%;
        }

        .filter-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 2px rgba(25, 135, 84, 0.10);
        }

        .filter-control::placeholder {
            color: #94a3b8;
        }

        .filter-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 36px;
            padding: 0 3px;
        }

        .filter-options .form-check {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-options .form-check-input {
            margin: 0;
            cursor: pointer;
        }

        .filter-options .form-check-label {
            font-size: 12px;
            color: #475569;
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-options .btn {
            height: 32px;
            font-size: 11px;
            white-space: nowrap;
            border-radius: 5px;
        }

        /* Mobile */
        @media (max-width: 575.98px) {

            .production-filter-card .card-body {
                padding: 9px;
            }

            .filter-control {
                font-size: 11px;
                height: 35px;
                min-height: 35px;
            }

            .filter-options {
                justify-content: space-between;
            }
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">
            <!-- 
            <div class="d-flex mb-1">
                <div>
                    <input type="text" class="form-control rounded-3 form-control-sm float-end" id="dc_report_search"
                        placeholder="Search...">
                </div>
            </div> -->

            <div class="card production-filter-card">
                <div class="card-body">

                    <div class="row g-2 align-items-center">

                        <!-- Row 1 -->

                        <!-- <div class="col-6 col-md-3 col-xl-2">
                            <input type="date" class="form-control filter-control" id="display_expired_due"
                                title="Expired / Due Date">
                        </div> -->

                        <div class="col-12 col-md-3 col-xl-2">
                            <input type="text" class="form-control filter-control" id="godown_id"
                                placeholder="Select Godown">
                        </div>

                        <div class="col-6 col-md-3 col-xl-2">
                            <select class="form-select filter-control" id="dep_id">
                                <option selected disabled value="">Department...</option>
                            </select>
                        </div>

                        <div class="col-6 col-md-3 col-xl-2">
                            <select class="form-select filter-control" id="sec_id">
                                <option selected disabled value="">Section...</option>
                            </select>
                        </div>


                        <!-- Row 2 -->

                        <div class="col-6 col-md-3 col-xl-2">
                            <select class="form-select filter-control" id="product_id">
                                <option selected disabled value="">Product...</option>
                            </select>
                        </div>

                        <div class="col-6 col-md-3 col-xl-2">
                            <select class="form-select filter-control" id="model_id">
                                <option selected disabled value="">Model...</option>
                            </select>
                        </div>

                        <div class="col-6 col-md-3 col-xl-2">
                            <select class="form-select filter-control" id="type_id">
                                <option selected disabled value="">Type...</option>
                            </select>
                        </div>

                        <div class="col-6 col-md-3 col-xl-2">
                            <input type="text" class="form-control filter-control" id="customer_id"
                                placeholder="Select Customer">
                        </div>

                        <div class="col-6 col-md-3 col-xl-2">
                            <input type="text" class="form-control filter-control" id="process_id"
                                placeholder="Select Process">
                        </div>

                        <div class="col-12 col-md-6 col-xl-4">
                            <div class="filter-options">

                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" checked id="display_pending_wo_only">

                                    <label class="form-check-label" for="display_pending_wo_only">
                                        Pending Work Only
                                    </label>
                                </div>

                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" id="display_expired_due">

                                    <label class="form-check-label" for="display_expired_due">
                                        Expired / Due Date Only
                                    </label>
                                </div>

                                <button type="button" class="btn btn-sm btn-outline-secondary"
                                    id="clear_production_filters">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                    Reset
                                </button>

                            </div>
                        </div>

                    </div>

                </div>
            </div>

            <div class="table-responsive production-report-wrapper">
                <table class="table table-bordered table-hover align-middle production-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Godown Details</th>
                            <th>Planned By</th>
                            <th>Order Details</th>
                            <th>Process Details</th>
                            <th>Total Work Order Summary</th>
                        </tr>
                    </thead>
                    <tbody id="planned_work_order_report_tbody"></tbody>
                </table>
            </div>



        </div>



    </div>



    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- SWAL FIRE -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/planned_work_order_report.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
