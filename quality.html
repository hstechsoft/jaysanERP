    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class="page-wrapper mt-3">

            <!-- Card wrapper -->
            <div class="card shadow-sm border-0 rounded-4">

                <!-- Header -->
                <div class="card-header bg-white border-0 py-3">
                    <div class="row g-2 align-items-center">

                        <div class="col-12 col-md-6">
                            <div class="form-floating">
                                <select class="form-select" id="Section">
                                    <option  disabled value="">Choose...</option>
                                    <option selected>Roller</option>
                                    <option>Gearbox</option>
                                    <option>Hydraulic</option>
                                    <option>Traveling Motor</option>
                                    <option>Loader</option>
                                    <option>Door</option>
                                    <option>Final</option>
                                </select>
                                <label for="Section">Section</label>
                            </div>
                        </div>

                        <div class="col-12 col-md-6 text-md-end">
                            <button type="button" class="btn btn-primary px-4" id="submit_btn">
                                <i class="bi bi-check-circle me-1"></i> Submit
                            </button>
                        </div>

                    </div>
                </div>

                <!-- Body -->
                <div class="card-body pt-0">

                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width:60px;">#</th>
                                    <th>Description</th>
                                    <th class="text-center" style="width:90px;">Select</th>
                                    <th>Remark</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td class="fw-semibold">1</td>
                                    <td>
                                        <span class="fw-semibold">Bearing</span>
                                        <!-- <div class="small text-muted">Standard spare 2025</div> -->
                                    </td>
                                    <td class="text-center">
                                        <input class="form-check-input" type="checkbox">
                                    </td>
                                    <td class="text-center">
                                        <input type="text" class="form-control rounded-3" id="remark"
                                            placeholder="Remark">

                                    </td>
                                </tr>

                                <tr>
                                    <td class="fw-semibold">2</td>
                                    <td>
                                        <span class="fw-semibold">M10 Plate washer</span>
                                        <!-- <div class="small text-muted">Heavy duty</div> -->
                                    </td>
                                    <td class="text-center">
                                        <input class="form-check-input" type="checkbox">
                                    </td>
                                    <td class="text-center">
                                        <input type="text" class="form-control rounded-3" id="remark"
                                            placeholder="Remark">

                                    </td>
                                </tr>
                                <tr>
                                    <td class="fw-semibold">2</td>
                                    <td>
                                        <span class="fw-semibold">Oil seal</span>
                                        <!-- <div class="small text-muted">Heavy duty</div> -->
                                    </td>
                                    <td class="text-center">
                                        <input class="form-check-input" type="checkbox">
                                    </td>
                                    <td class="text-center">
                                        <input type="text" class="form-control rounded-3" id="remark"
                                            placeholder="Remark">

                                    </td>
                                </tr>
                            </tbody>
                        </table>

                </div>

            </div>
