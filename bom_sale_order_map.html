<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .boxborder {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            height: 100%;
        }

        .boxborder legend {
            width: auto;
            padding: 0 10px;
            font-size: 15px;
            font-weight: 600;
            color: #0d6efd;
            margin-bottom: 10px;
        }

        .form-check-label {
            width: 100%;
        }

        .card {
            transition: .3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
        }

        .card-header {
            font-weight: 600;
            letter-spacing: .5px;
        }

        .form-control,
        .form-select {
            min-height: 48px;
            border-radius: 12px;
            border: 1px solid #dce1e7;
            transition: .3s;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 .2rem rgba(13, 110, 253, .15);
        }

        .form-label {
            color: #495057;
            margin-bottom: .45rem;
        }

        #product_card {
            background: #ffffff;
        }

        @media (max-width:768px) {

            .card {
                margin-bottom: 15px;
            }

            .card-header h6 {
                font-size: 15px;
            }

            .form-control,
            .form-select {
                min-height: 45px;
                font-size: 14px;
            }

        }

        @media (max-width: 576px) {
            .boxborder {
                padding: 12px;
            }

            .boxborder legend {
                font-size: 14px;
            }

            .form-check-label {
                font-size: 13px;
            }

            .badge {
                margin-top: 4px;
            }
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="row">

                <div class="col-lg-4 col-md-5">

                    <!-- Product Variant -->
                    <div class="card shadow-sm border-0 rounded-4 mb-4">

                        <div class="card-header bg-primary text-white rounded-top-4">
                            <h6 class="mb-0">
                                <i class="bi bi-box-seam me-2"></i>
                                Product Variant
                            </h6>
                        </div>

                        <div class="card-body">

                            <div class="form-floating">
                                <input type="text" class="form-control rounded-3" id="part_name"
                                    placeholder="Product Variant">
                                <label for="part_name">Product Variant</label>
                            </div>

                        </div>

                    </div>

                    <!-- Product Details -->
                    <div class="card shadow-sm border-0 rounded-4" id="product_card">

                        <div class="card-header bg-success text-white rounded-top-4">
                            <h6 class="mb-0">
                                <i class="bi bi-grid-fill me-2"></i>
                                Product Details
                            </h6>
                        </div>

                        <div class="card-body">

                            <!-- Product -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="bi bi-box me-1"></i>
                                    Product
                                </label>

                                <select class="form-select rounded-3" id="product">
                                    <option value="" selected disabled>
                                        Choose Product...
                                    </option>
                                </select>
                            </div>

                            <!-- Model -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="bi bi-layers me-1"></i>
                                    Model
                                </label>

                                <select class="form-select rounded-3" id="pmodel" disabled>
                                    <option value="" selected disabled>
                                        Choose Model...
                                    </option>
                                </select>
                            </div>

                            <!-- Type -->
                            <div class="mb-1">
                                <label class="form-label fw-semibold">
                                    <i class="bi bi-diagram-3 me-1"></i>
                                    Type
                                </label>

                                <select class="form-select rounded-3" id="ptype" disabled>
                                    <option value="" selected disabled>
                                        Choose Type...
                                    </option>
                                </select>
                            </div>

                        </div>

                    </div>

                    <div class="text-center my-2">
                        <button type="button" class="btn btn-primary" id="filter_btn"><i class="fa fa-filter"></i> Filter</button>
                    </div>

                </div>

                <div class="col-md-8">

                    <div class="card d-none" id="product_sub_type_card">
                        <div class="card-header ">
                            <h6 class="mb-0 text-center">Product Sub Type</h6>
                        </div>

                        <div class="card-body">
                            <div class="row g-3" id="sub_type_div"></div>
                        </div>
                        <div>
                            <button type="button" class="btn btn-primary float-end m-2" id="map_btn">Submit</button>
                        </div>
                    </div>


                </div>

            </div>

            <div class="table-responsive">
                <table class="table small caption-top table-bordered table-striped ">
                    <caption></caption>
                    <thead class="small">

                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Product Variant</th>
                            <th scope="col">Product Details</th>
                            <th scope="col">BOM's Mapped</th>
                            <th scope="col">Action</th>

                        </tr>
                    </thead>
                    <tbody class="small" id="mapped_tbody">



                    </tbody>


                </table>
            </div>

        </div>

    </div>




    </div>



    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- SWAL FIRE -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/bom_sale_order_map.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
