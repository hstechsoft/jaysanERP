<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        table td,
        tr {
            text-align: center;
            vertical-align: middle;
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="row">
                <div class="col-md-4">
                    <form class="p-3 border-0 rounded-4 shadow bg-white needs-validation" id="nesting_entry_form"
                        novalidate onsubmit="return false;">

                        <!-- Header -->
                        <div class="text-center mb-3">
                            <h5 class="fw-bold text-primary mb-1">
                                <i class="fa-solid fa-layer-group me-2"></i>
                                Nesting Entry
                            </h5>
                            <small class="text-muted">Create Standard Nesting</small>
                            <hr>
                        </div>


                        <div class="row g-2">

                            <!-- Nesting -->
                            <div class="col-12">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-object-group"></i>
                                    </span>
                                    <input type="text" class="form-control" id="nesting_name" placeholder="Nesting Name"
                                        required>
                                </div>
                            </div>

                            <!-- Material -->
                            <div class="col-12">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-cubes"></i>
                                    </span>
                                    <input type="text" class="form-control" id="material_id" placeholder="Material"
                                        required>
                                </div>
                            </div>

                            <!-- Standard Length -->
                            <!-- <div class="col-md-6">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-tape"></i>
                                    </span>
                                    <input type="number" class="form-control" id="std_length"
                                        placeholder="Standard Length" required>
                                </div>
                            </div> -->

                            <!-- Runtime -->
                            <div class="col-md-6 d-none">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">
                                        <i class="fa-regular fa-clock"></i>
                                    </span>
                                    <input type="number" min="1" class="form-control" id="run_time"
                                        placeholder="Run Time (In Min)" required>
                                </div>
                            </div>

                            <!-- Dimension -->
                            <div class="col-12">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-ruler-combined"></i>
                                    </span>
                                    <input type="text" class="form-control" id="dimension" placeholder="Dimension"
                                        required>
                                </div>
                            </div>

                            <!-- weight -->
                            <div class="col-md-6">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">
                                        <i class="fa-classic fa-solid fa-scale-unbalanced-flip"></i>
                                    </span>
                                    <input type="number" min="1" class="form-control" id="weight"
                                        placeholder="Weight (In Kgs)" required>
                                </div>
                            </div>

                            <!-- Scrap weight -->
                            <div class="col-md-6">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-dumpster-fire"></i>
                                    </span>
                                    <input type="number" min="1" class="form-control" id="scrap_weight"
                                        placeholder="Scrap Weight (Kgs)" readonly required>
                                </div>
                            </div>

                            <!-- Product -->
                            <!-- <div class="col-12 ">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-box-open"></i>
                                    </span>
                                    <input type="text" class="form-control" id="product" placeholder="Product" required>
                                </div>
                            </div> -->


                            <!-- File -->
                            <div class="col-md-8">
                                <label class="small fw-semibold text-danger mb-1">
                                    <i class="fa-solid fa-file-pdf me-1"></i>
                                    Upload PDF Only
                                </label>

                                <input type="file" class="form-control form-control-sm" id="nest_file">
                            </div>

                            <div class="col-md-4">
                                <button type="button" class="btn btn-small btn-primary d-none" id="view_file"><i
                                        class="fa-solid fa-file-lines"></i> View File</button>
                            </div>



                        </div>


                        <!-- Godown & Machine -->

                        <div class="mt-4">

                            <h6 class="fw-bold text-secondary mb-2">
                                <i class="fa-solid fa-cash-register me-2"></i>
                                Machine
                            </h6>

                            <div class="row g-2">

                                <div class="col-md-6">
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text">
                                            <i class="fa-solid fa-dumpster-fire"></i>
                                        </span>
                                        <input type="text" min="1" class="form-control" id="godown" placeholder="Godown"
                                            required>
                                    </div>
                                </div>


                                <div class="col-md-6">
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text">
                                            <i class="fa-solid fa-warehouse"></i>
                                        </span>
                                        <input type="text" min="1" class="form-control" id="department"
                                            placeholder="Department" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text">
                                            <i class="fa-solid fa-boxes-stacked"></i>
                                        </span>
                                        <input type="text" min="1" class="form-control" id="section"
                                            placeholder="Section" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text">
                                            <i class="fa-solid fa-tractor"></i>
                                        </span>
                                        <input type="text" min="1" class="form-control" id="machine"
                                            placeholder="Machine" required>
                                    </div>
                                </div>

                                <div class="col-md-5">
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text">
                                            <i class="fa-regular fa-clock"></i>
                                        </span>
                                        <input type="number" min="1" class="form-control" id="run_timee"
                                            placeholder="Run Time Mins" required>
                                    </div>
                                </div>
                                <div class="col-md-5">
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text">
                                            <i class="fa-regular fa-clock"></i>
                                        </span>
                                        <input type="number" min="1" class="form-control" id="handling_time"
                                            placeholder="Handling Time Mins" required>
                                    </div>
                                </div>
                                <!-- <div class="col-6">
                                    <div class="form-floating mb-2">
                                        <input type="text" class="form-control rounded-3" id="cost" value="0"
                                            placeholder="">
                                        <label for="cost">Cost
                                            <span class="text-danger">*</span> </label>

                                        <div class="invalid-feedback">
                                            Kindly Enter Vaild Data
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check mb-3">
                                        <input class="form-check-input " type="checkbox" value="" id="is_default"
                                            style="height: 20px;">
                                        <label class="form-check-label" for="is_default">
                                            Is Default?
                                        </label>
                                    </div>
                                </div> -->
                            
                                <div class="col-md-2 d-grid">
                                    <button type="button" class="btn btn-primary btn-sm rounded-pill"
                                        id="nested_machine_add_btn">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>

                            </div>

                        </div>

                        
                        <!-- Table -->
                        <div class="table-responsive mt-3" style="max-height: 30vh; overflow-y: auto;">
                            <table class="table table-sm table-hover text-center align-middle border small">
                                <thead class="table-primary small"
                                    style=" position: sticky;  z-index: 5; top: 0; background-color: rgb(193, 216, 236);">
                                    <tr>
                                        <th>
                                            <i class="fa-solid fa-tractor me-1"></i>
                                            Machine
                                        </th>

                                        <th>
                                            <i class="fa-regular fa-clock me-1"></i>
                                            Run Time
                                        </th>

                                        <th>
                                            <i class="fa-regular fa-clock me-1"></i>
                                            Handling Time
                                        </th>

                                        <th>
                                            <i class="fa-solid fa-gear me-1"></i>
                                            Action
                                        </th>
                                    </tr>
                                </thead>

                                <tbody id="nesting_machine_tbody" class="small"></tbody>

                            </table>
                        </div>

                        <!-- Nested Parts -->
                        <div class="mt-4">

                            <h6 class="fw-bold text-secondary mb-2">
                                <i class="fa-solid fa-diagram-project me-2"></i>
                                Nested Parts
                            </h6>

                            <div class="row g-2">
                                <div class="col-4">
                                    <input type="text" class="form-control form-control-sm" id="nested_parts"
                                        placeholder="Part Name">
                                </div>

                                <div class="col-2">
                                    <input type="number" min="1" class="form-control form-control-sm"
                                        id="nested_part_qty" placeholder="Qty">
                                </div>


                                <!-- weight -->
                                <div class="col-4">
                                    <input type="number" min="1" class="form-control form-control-sm"
                                        id="nested_part_weight" placeholder="Weight(Kgs)">
                                </div>

                                <div class="col-2 d-grid">
                                    <button type="button" class="btn btn-primary btn-sm rounded-pill"
                                        id="nested_part_add_btn">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            </div>

                        </div>


                        <!-- Table -->
                        <div class="table-responsive mt-3" style="max-height: 30vh; overflow-y: auto;">
                            <table class="table table-sm table-hover text-center align-middle border small">
                                <thead class="table-primary small"
                                    style=" position: sticky;  z-index: 5; top: 0; background-color: rgb(193, 216, 236);">
                                    <tr>
                                        <th>
                                            <i class="fa-solid fa-cube me-1"></i>
                                            Part
                                        </th>

                                        <th>
                                            <i class="fa-solid fa-sort-numeric-up me-1"></i>
                                            Qty
                                        </th>

                                        <th>
                                            <i calss="fa-classic fa-solid fa-scale-unbalanced-flip"></i>
                                            Weight
                                        </th>

                                        <th>
                                            <i class="fa-solid fa-gear me-1"></i>
                                            Action
                                        </th>
                                    </tr>
                                </thead>

                                <tbody id="nesting_parts_tbody" class="small"></tbody>

                            </table>
                        </div>



                        <!-- Buttons -->
                        <div class="d-flex gap-2 mt-3">

                            <button class="btn btn-primary flex-fill rounded-pill shadow-sm" id="add_nesting_btn">
                                <i class="fa-solid fa-circle-plus me-1"></i>
                                Add
                            </button>

                            <button class="btn btn-success flex-fill rounded-pill shadow-sm d-none"
                                id="update_nesting_btn">
                                <i class="fa-solid fa-pen-to-square me-1"></i>
                                Update
                            </button>

                            <button class="btn btn-warning flex-fill rounded-pill shadow-sm" id="clear_btn">
                                <i class="fa-solid fa-rotate me-1"></i>
                                Clear
                            </button>

                        </div>

                    </form>
                </div>

                <div class="col-md-8">

                    <div class="table-responsive" style="max-height: 80vh; overflow-y: auto;">
                        <table class="table caption-top small table-striped ">
                            <caption></caption>
                            <thead class="small"
                                style="position: sticky; z-index: 5; top: 0; background-color: rgb(214, 229, 241);">

                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Nesting Name</th>
                                    <th scope="col">Material</th>
                                    <th scope="col">Run Time</th>
                                    <th scope="col">Dimension</th>
                                    <th scope="col">Type</th>
                                    <th scope="col">Nested Parts</th>
                                    <th scope="col">Action</th>

                                </tr>
                            </thead>
                            <tbody class="small" id="nesting_details_tbody">




                            </tbody>


                        </table>
                    </div>

                </div>

            </div>

        </div>




    </div>




    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- SWAL FIRE -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/nesting_master.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
