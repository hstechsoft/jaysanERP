<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">



    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery.rateit/1.1.5/rateit.css"
        integrity="sha512-UBZiEmhvSN+QLmroxtPWf4f1SsvHlDTAKqMfRw8g9vxALzXsPd/pkwgULarTBp28QRW+L70bAU6Z5Noh0A+OIg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css">


    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">


    <style>
        body {
            background: #f5f7fb;
            font-size: 13px;
        }

        /* CARD */
        .card {
            border-radius: 12px !important;
            overflow: hidden;
        }

        /* FORM */
        .form-floating {
            margin-bottom: 6px !important;
        }

        .form-control,
        .form-select {
            min-height: 38px !important;
            height: 38px !important;
            padding: 6px 10px !important;
            font-size: 12px !important;
            border-radius: 8px !important;
        }

        .form-floating label {
            padding: 8px 10px !important;
            font-size: 12px;
        }

        /* BUTTON */
        .btn {
            height: 38px;
            padding: 4px 10px !important;
            font-size: 12px !important;
            border-radius: 8px !important;
        }

        /* TABLE */
        .table {
            margin-bottom: 0 !important;
        }

        .table th {
            font-size: 12px;
            padding: 6px !important;
            white-space: nowrap;
        }

        .table td {
            font-size: 12px;
            padding: 5px !important;
            vertical-align: middle;
        }

        /* CARD BODY */
        .card-body {
            padding: 10px !important;
        }

        /* HEADINGS */
        h5 {
            font-size: 16px;
            margin-bottom: 8px !important;
        }

        h6 {
            font-size: 13px;
            margin-bottom: 8px !important;
        }

        /* ROW GAP */
        .row {
            --bs-gutter-x: .5rem !important;
            --bs-gutter-y: .5rem !important;
        }

        /* MOBILE */
        @media(max-width:768px) {

            .form-control,
            .form-select {
                font-size: 11px !important;
            }

            .table th,
            .table td {
                font-size: 11px;
                padding: 4px !important;
            }

            .btn {
                font-size: 11px !important;
            }

        }

        @media (min-width: 1023px) {
            .service_table {
                max-height: 100vh !important;
            }

        }
    </style>


</head>

<body>

    <div class="container-fluid p-0 m-0 ">



        <section id="top_bar">
            <div class=" d-flex justify-content-between align-items-center text-bg-primary p-1">

                <div>
                    <h6>Welcome <span id="role_name_txt"></span></h6>
                </div>

                <div>

                    <button class="btn   text-white border-0 " type="button" id="topbar_logout_btn"
                        aria-expanded="false">


                        <i class="fa-solid fa-right-from-bracket   me-2"></i>
                    </button>


                </div>

            </div>
        </section>

        <div class="d-flex justify-content-between border border-1">
            <img class="card-img-top img-fluid w-25 " src="img/jaysan_logo.png" alt="Card image cap ">
            <div class="my-auto">

                <a href="dealer_index.html" type="button"> <i class="fa-solid fa-house" href="add_candidate.html"></i>
                </a>
            </div>

            <div class="my-auto">
                <h6>Dealer Dasboard</h6>
            </div>


        </div>
        <div class="row g-3">

            <!-- LEFT SIDE -->
            <div class="col-12 col-lg-4">

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body">

                        <h5 class="fw-bold text-primary mb-3">
                            Service Entry
                        </h5>

                        <!-- Dealer -->
                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" disabled id="dealer_name" placeholder="Dealer">
                            <label for="dealer_name">Dealer</label>
                        </div>

                        <!-- Customer -->
                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" id="customer_name" placeholder="Customer">
                            <label for="customer_name">Customer</label>
                        </div>

                        <!-- Phone -->
                        <div class="form-floating mb-2">
                            <input type="number" class="form-control rounded-3" id="customer_number"
                                placeholder="Phone">
                            <label for="customer_number">Customer Phone</label>
                        </div>

                        <!-- Phone -->
                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" id="customer_address" placeholder="Phone">
                            <label for="customer_address">Customer Address</label>
                        </div>

                        <!-- Place -->
                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" id="place" placeholder="Place">
                            <label for="place">Place Of Service</label>
                        </div>

                        <!-- Implement -->
                        <div class="form-floating mb-2">
                            <select class="form-select rounded-3" id="implement">
                                <option selected disabled value="">Choose...</option>
                            </select>
                            <label for="implement">Implement</label>
                        </div>

                        <!-- Chasis No -->
                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" id="chasis_no" placeholder="Chasis/No">
                            <label for="chasis_no">Chasis/No</label>
                        </div>

                        <!-- Service Date -->
                        <div class="form-floating mb-3">
                            <input type="datetime-local" class="form-control rounded-3" id="service_date">
                            <label for="service_date">Service Date</label>
                        </div>

                        <!-- Problem Section -->
                        <div class="card border-0 bg-light rounded-4 mb-3">
                            <div class="card-body p-3">

                                <h6 class="fw-semibold mb-3 text-secondary">
                                    Problems
                                </h6>

                                <div class="row g-2 align-items-center">

                                    <div class="col-9">
                                        <div class="form-floating">
                                            <input type="text" class="form-control rounded-3" id="problem">
                                            <label for="problem">Problem</label>
                                        </div>
                                    </div>

                                    <div class="col-3 d-grid">
                                        <button type="button" class="btn btn-primary rounded-3 h-100"
                                            id="add_problem_btn">
                                            +
                                        </button>
                                    </div>

                                </div>

                                <div class="table-responsive mt-3">
                                    <table class="table table-sm table-bordered align-middle mb-0">
                                        <thead class="table-primary">
                                            <tr>
                                                <th>Problem</th>
                                                <th width="20%">Action</th>
                                            </tr>
                                        </thead>

                                        <tbody id="problem_table_body">
                                        </tbody>

                                    </table>
                                </div>

                            </div>
                        </div>

                        <!-- Solution -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control rounded-3" id="solution" placeholder="Solution">
                            <label for="solution">Solution</label>
                        </div>

                        <!-- Employee Section -->
                        <div class="card border-0 bg-light rounded-4 mb-3">
                            <div class="card-body p-3">

                                <h6 class="fw-semibold mb-3 text-secondary">
                                    Service Persons
                                </h6>

                                <div class="row g-2 align-items-center">

                                    <div class="col-9">
                                        <div class="form-floating">
                                            <input type="text" class="form-control rounded-3" id="employee1"
                                                placeholder="Service Person">
                                            <label for="employee1">Service Person</label>
                                        </div>
                                    </div>

                                    <div class="col-3 d-grid">
                                        <button type="button" class="btn btn-primary rounded-3 h-100"
                                            id="add_employee_btn">
                                            +
                                        </button>
                                    </div>

                                </div>

                                <div class="table-responsive mt-3">
                                    <table class="table table-sm table-bordered align-middle mb-0">
                                        <thead class="table-primary">
                                            <tr>
                                                <th>Service Person</th>
                                                <th width="20%">Action</th>
                                            </tr>
                                        </thead>

                                        <tbody id="employee_table_body">
                                        </tbody>

                                    </table>
                                </div>

                                <div class="d-flex justify-content-between gap-2 border border-1 my-2">


                                    <div class="d-flex justify-content-start gap-2">
                                        <label class='input-group-text' for='rating_service'><span>
                                                Service Rating
                                            </span>
                                        </label>

                                        <div class="rateit align-self-center" id="rating_service" style="font-size:30px"
                                            data-rateit-mode="font" data-rateit-resetable="false">
                                        </div>




                                    </div>

                                    <button type="button" class="btn btn-primary">
                                        <span id="service_rno">0</span>/5
                                    </button>
                                </div>


                                <div class="d-flex justify-content-between gap-2 border border-1 mb-2">


                                    <div class="d-flex justify-content-start gap-2">
                                        <label class='input-group-text' for='rating_dealer'><span>
                                                Dealer Rating
                                            </span>
                                        </label>

                                        <div class="rateit align-self-center" id="rating_dealer" style="font-size:30px"
                                            data-rateit-mode="font" data-rateit-resetable="false">
                                        </div>




                                    </div>

                                    <button type="button" class="btn btn-primary">
                                        <span id="dealer_rno">0</span>/5
                                    </button>
                                </div>

                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid">
                            <button type="button" class="btn btn-primary btn-lg rounded-3 shadow-sm"
                                id="add_service_details_btn">

                                Add Service Details

                            </button>
                        </div>

                    </div>
                </div>

            </div>

            <!-- RIGHT SIDE -->
            <div class="col-12 col-lg-8">

                <div class="card border-0 shadow-sm rounded-4">

                    <div class="card-body">

                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
                            <h5 class="fw-bold text-primary mb-2 mb-md-0">
                                Service History
                            </h5>

                            <input type="text" class="form-control w-100 w-md-25 rounded-3" id="service_search"
                                placeholder="Search...">
                        </div>

                        <div class="table-responsive service_table" style="max-height: 50vh; overflow-y: auto;">

                            <table class="table table-hover table-bordered align-middle">

                                <thead class="table-primary text-nowrap" style="position: sticky; z-index: 5; top: 0; ">

                                    <tr>
                                        <th>#</th>
                                        <th>Customer</th>
                                        <th>Service Place</th>
                                        <th>Service Person</th>
                                        <th>Chasis/No</th>
                                        <th>Implement</th>
                                        <th>Problem</th>
                                        <th>Solution</th>
                                        <th>Date</th>
                                    </tr>

                                </thead>

                                <tbody id="service_history_table">

                                    <tr>
                                        <td colspan="10" class="text-center text-muted py-4">
                                            No Service Records Found
                                        </td>
                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>



    < <script type="text/javascript" src="//code.jquery.com/jquery-1.11.0.min.js">
        </script>
        <script type="text/javascript" src="//code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
        <script src="//code.jquery.com/ui/1.12.1/jquery-ui.js"></script>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>
        <script src='//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit'></script>

        <!-- Sweet alert -->
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.rateit/1.1.5/jquery.rateit.min.js"
            integrity="sha512-ttBgr7TNuS+00BFNY+TkWU9chna3buySaRKoA9IMmk+ueesPbUfyEsWdn5mrXB+cG+ziRdEXMHmsJjGmzBZJYQ=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <!-- external js -->
        <script src="js/dealer_service.js" type="module"></script>

</body>

</html>
