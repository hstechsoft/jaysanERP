<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .add-box {
            border: 2px dashed #0d6efd;
            border-radius: 12px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            transition: 0.3s;
        }

        .add-box:hover {
            background-color: #e7f1ff;
        }

        .add-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background-color: #0d6efd;
            color: white;
            font-size: 24px;
            transition: 0.3s;
        }

        .add-btn:hover {
            background-color: #0b5ed7;
            transform: scale(1.05);
        }

        .machine-card {
            border-radius: 20px;
            overflow: hidden;
            border: none;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.35s ease;
        }

        .machine-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.15);
        }

        /* Header Gradient */
        .machine-card .card-header {
            background: linear-gradient(135deg, #0d6efd, #198754);
            padding: 18px;
            color: white;
        }

        /* Status Badge */
        .status-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(6px);
        }

        /* Motivation Box */
        .motivation-box {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 15px;
            border-radius: 15px;
            font-size: 14px;
            color: #333;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.04);
        }

        /* Time Box */
        .time-box {
            background: #e6f4ea;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            color: #0f5132;
            font-weight: 500;
        }

        /* Buttons */
        #start_work,
        #end_work,
        #resume_work,
        #pause_work {
            border-radius: 50px;
            transition: all 0.3s ease;
            font-size: 10px;
        }

        #start_work:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(25, 135, 84, 0.4);
        }

        #end_work:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(220, 53, 69, 0.4);
        }

        #resume_work:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(53, 125, 220, 0.4);
        }

        #pause_work:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(220, 203, 53, 0.4);
        }

        .start-bg {
            background: linear-gradient(135deg, #66ceea, #794ba2);
        }

        .start-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .start-icon {
            font-size: 40px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: auto;
            color: white;
        }

        .quote-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px 18px;
            font-style: italic;
            color: #444;
            position: relative;
        }

        .quote-mark {
            font-size: 20px;
            color: #999;
        }

        .start-btn {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.25s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .quote-icon {
            font-size: 40px;
            display: inline-block;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0
            }

            70% {
                transform: scale(1.2)
            }

            100% {
                transform: scale(1);
                opacity: 1
            }
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5">

            <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center start-bg"
                id="star_screen">

                <div class="col-xl-4 col-lg-5 col-md-7 col-11">

                    <div class="start-card text-center p-4 p-md-5">

                        <!-- Icon -->
                        <div class="mb-3">
                            <div class="start-icon">
                                🚀
                            </div>
                        </div>

                        <!-- Title -->
                        <h2 class="fw-bold mb-2">Start Your Work Day</h2>

                        <p class="text-muted small mb-4">
                            Select your section and begin today's work
                        </p>

                        <!-- Quote -->
                        <div class="quote-box mb-4">

                            <div class="d-flex justify-content-end mb-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="lang_toggle">
                                    <label class="form-check-label small">English</label>
                                </div>
                            </div>

                            <div class="text-center mb-2">
                                <span id="quote_icon" class="quote-icon">🔥</span>
                            </div>

                            <p id="quote_text" class="mb-0 text-center"></p>

                        </div>

                        <!-- Section Select -->
                        <div class="form-floating mb-4">
                            <select class="form-select" id="section_select">
                                <option selected disabled value="null">Choose Section</option>
                            </select>
                            <label>Select Section</label>
                        </div>

                        <!-- Button -->
                        <button class="btn start-btn w-100 py-3 fw-semibold" id="start_day_btn">
                            Start My Day
                        </button>

                    </div>

                </div>

            </div>


            <div class="container py-4 d-none" id="after_star">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-5" id="scan_section">

                        <div class="card shadow-lg border-0 rounded-4">

                            <div class="card-header bg-primary text-white text-center rounded-top-4">
                                <h5 class="mb-0">📦 Production QR Scanner</h5>
                            </div>

                            <div class="card-body p-4">

                                <!-- Section Select -->
                                <div class="form-floating mb-3">
                                    <select class="form-select" id="section_select">
                                        <option selected disabled value="null">Choose Section</option>
                                    </select>
                                    <label>Select Section</label>
                                </div>

                                <!-- Scan Button -->
                                <div class="d-grid mb-3 d-none qr_section">

                                    <!-- Plus Box -->
                                    <div class="add-box mb-3">
                                        <button type="button" class="add-btn" id="openScannerBtn">
                                            <i class="fa-solid fa-plus"></i>
                                        </button>
                                    </div>

                                    <!-- ID Input -->
                                    <div class="form-floating mb-2">
                                        <input type="text" class="form-control rounded-3" id="job_ass_id"
                                            placeholder="">
                                        <label for="job_ass_id">ID</label>
                                    </div>

                                    <button type="button" class="btn btn-success px-4 me-2 fw-bold shadow-sm"
                                        id="start_work">
                                        ▶ Start Work
                                    </button>

                                </div>

                            </div>
                        </div>

                    </div>

                    <div class="col-12 col-md-6 col-lg-4 d-none" id="timing_section">

                    </div>
                </div>



                <div class="accordion" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="headingOne">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                data-bs-target="#work_completed_list" aria-expanded="true"
                                aria-controls="work_completed_list">
                                Work Completed List
                            </button>
                        </h2>
                        <div id="work_completed_list" class="accordion-collapse collapse " aria-labelledby="headingOne"
                            data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <div class="card shadow-sm  mt-3">
                                    <div class="card-body p-0 ">

                                        <div class="table-responsive " style="max-height: 50vh; overflow-y: auto;">
                                            <table class="table table-bordered table-striped align-middle">

                                                <thead class="table-primary text-center small"
                                                    style="position: sticky; top: 0; z-index: 5; font-size: 14px; text-align: center;  background: #cfe2ff;">
                                                    <tr>
                                                        <th>#</th>

                                                        <th>Part Name</th>

                                                        <th>Qty</th>

                                                        <th>Action</th>
                                                    </tr>
                                                </thead>

                                                <tbody id="work_compeleted_tbody" class="small">

                                                </tbody>

                                            </table>
                                        </div>

                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>



                <div class="accordion" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="headingOne">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                data-bs-target="#upcoming_machine" aria-expanded="true"
                                aria-controls="upcoming_machine">
                                Upcoming Machines
                            </button>
                        </h2>
                        <div id="upcoming_machine" class="accordion-collapse collapse " aria-labelledby="headingOne"
                            data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <div class="card shadow-sm  mt-3">
                                    <div class="card-body p-0 d-none d-md-block">

                                        <div class="table-responsive " style="max-height: 50vh; overflow-y: auto;">
                                            <table class="table table-bordered table-striped align-middle">

                                                <thead class="table-primary text-center"
                                                    style="position: sticky; top: 0; z-index: 5; font-size: 14px; text-align: center;  background: #cfe2ff;">
                                                    <tr>
                                                        <th style="width: 10%;">Line/No</i>
                                                        </th>

                                                        <th style="width: 50%;">

                                                            <div class="d-flex justify-content-between">
                                                                <!-- Customer Label -->
                                                                <div class="d-flex align-items-center">
                                                                    <i class="fa-solid fa-user-group me-1"></i>
                                                                    <span>Customer</span>
                                                                </div>
                                                                <div class="input-group input-group-sm"
                                                                    style="width: 180px;">
                                                                    <span class="input-group-text bg-white border-0">
                                                                        <i class="fa fa-search text-muted"></i>
                                                                    </span>
                                                                    <input type="text" id="production_line_search"
                                                                        class="form-control border-0 bg-white"
                                                                        placeholder="Search...">
                                                                </div>
                                                            </div>

                                                        </th>

                                                        <th style="width: 40%;">
                                                            <i class="fa-solid fa-industry me-1"></i> Machine Details
                                                        </th>
                                                    </tr>
                                                </thead>

                                                <tbody id="arrange_order_tbody">
                                                    <!-- JS Inserts Rows Here -->
                                                </tbody>

                                            </table>
                                        </div>

                                    </div>
                                    <div class="card-body d-block d-md-none p-2 text-center"
                                        style="max-height: 50vh; overflow-y: auto;">
                                        <!-- <b class=" p-1">Upcoming Machines</b> -->
                                        <div id="mobile_view_arrange_order_tbody">
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>


                <div class="accordion" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="headingOne">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                data-bs-target="#work_entry" aria-expanded="true" aria-controls="work_entry">
                                Add Work Entry
                            </button>
                        </h2>
                        <div id="work_entry" class="accordion-collapse collapse " aria-labelledby="headingOne"
                            data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <div class="card shadow-sm  mt-3">
                                    <div class="card-body p-2 text-center">

                                        <div class="form-floating mb-2">
                                            <input type="text" class="form-control rounded-3" id="worked_section"
                                                placeholder="">
                                            <label for="worked_section">Section </label>
                                        </div>

                                        <div class="form-floating mb-2">
                                            <input type="text" class="form-control rounded-3" id="worked_parts"
                                                placeholder="">
                                            <label for="worked_parts">Part </label>
                                        </div>

                                        <div class="form-floating mb-2">
                                            <input type="text" class="form-control rounded-3" id="worked_process"
                                                placeholder="">
                                            <label for="worked_process">Process </label>
                                        </div>

                                        <div class="form-floating mb-2">
                                            <input type="number" class="form-control rounded-3" id="worked_qty"
                                                placeholder="">
                                            <label for="worked_qty">qty </label>
                                        </div>

                                        <button type="submit" class="btn btn-primary " id="add_work_entry_btn">Add
                                            Work</button>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>


            </div>


        </div>




    </div>




    <!-- Modal -->
    <div class="modal fade" id="pause_workModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="pause_workModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="pause_workModalLabel">Do You Need to Pause the Work?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="card">
                        <div class="form-floating mb-3">
                            <textarea class="form-control rounded-3" placeholder="" id="pause_reason" required
                                style="height: 120px"></textarea>
                            <label for="pause_reason">Reason</label>
                            <span class="text-danger">*</span>
                            <div class="invalid-feedback">
                                Kindly Enter Vaild
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="pause_work_btn">Submit</button>
                </div>
            </div>
        </div>
    </div>
    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>
    <!-- Sweet alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <!-- QR Code Scanning -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- external js -->
    <script src="js/job_card_qr_scan.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
