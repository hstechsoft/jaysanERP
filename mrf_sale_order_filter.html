    <style>
        /* Overall compact spacing */
        .form-floating .form-control {
            height: 42px;
            padding: 0.4rem 0.75rem;
        }

        .mrf_table,
        .sale_table {
            background: #fdfdfd;
            padding: 12px 16px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
        }

        .mrf_table p,
        .sale_table p {
            font-weight: 500;
            margin-right: 10px;
            display: flex;
            align-items: center;
        }

        .mrf_table p::before {
            content: "\f3c5";
            /* bi-search icon */
            font-family: "bootstrap-icons";
            margin-right: 6px;
            color: #0d6efd;
        }

        .sale_table p::before {
            content: "\f3c5";
            font-family: "bootstrap-icons";
            margin-right: 6px;
            color: #198754;
        }

        table td,
        table th {
            padding: 6px 10px !important;
            font-size: 14px;
        }

        .card {
            border-radius: 12px !important;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            font-weight: 600;
            font-size: 16px;
            background: linear-gradient(45deg, #4a72ff, #6ea1ff);
            color: white;
            padding: 10px 15px !important;
        }

        .card-body {
            padding: 8px 12px !important;
        }

        #filter_heading {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: 600;
            color: #555;
        }

        .form-check-input {
            cursor: pointer;
        }

        .form-check-label {
            margin-left: 5px;
            font-weight: 500;
        }

        /* Smooth toggle transition */
        .sale_table,
        .mrf_table {
            transition: all 0.3s ease-in-out;
        }
    </style>


</head>
