<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox/fancybox.css" />
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .dc-card {
            border-radius: 12px;
        }

        .location-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px;
        }

        .location-header {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }

        .part-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: white;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #eee;
        }

        .part-name {
            font-size: 14px;
            font-weight: 600;
        }

        .qty-badge {
            background: #0d6efd;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .accordion-item {
            border-radius: 10px;
            overflow: hidden;
        }

        .accordion-button {
            font-size: 0.9rem;
            background: #fff;
        }

        .accordion-button:not(.collapsed) {
            background: #f8f9fa;
            color: #212529;
        }

        .accordion-button:focus {
            box-shadow: none;
        }

        .accordion-button::after {
            width: 0.9rem;
            height: 0.9rem;
            background-size: 0.9rem;
        }

        .accordion-body {
            font-size: 0.9rem;
        }

        .badge {
            font-size: 0.75rem;
        }

        .border-bottom:last-child {
            border-bottom: none !important;
        }

        #manual_dc_tbody td {
            vertical-align: middle;
        }

        #manual_dc_tbody input[type="number"] {
            min-width: 80px;
        }

        .modal-body .badge {
            font-size: 11px;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(63, 63, 63, 0.4);
            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loading i {
            color: rgb(255, 148, 0);
            font-size: 3rem;
        }

        .godown-container {
            max-height: 400px;
            overflow-y: auto;
        }

        .godown-item {
            border: none !important;
            border-radius: 12px !important;
            margin-bottom: 10px;
            padding: 14px 16px;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;

            transition: all .25s ease;
        }

        .godown-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(0, 0, 0, .12);
        }

        .godown-name {
            font-weight: 600;
            color: #212529;
            margin: 0;
        }

        .godown-distance {
            font-size: .85rem;
            color: #6c757d;
        }

        .select_btn {
            border-radius: 25px;
            padding: 6px 14px;
            white-space: nowrap;
        }

        @media (max-width: 576px) {
            .godown-item {
                padding: 12px;
            }

            .godown-name {
                font-size: .95rem;
            }

            .godown-distance {
                font-size: .8rem;
            }

            .select_btn {
                padding: 5px 10px;
                font-size: .8rem;
            }
        }

        @media (max-width: 576px) {
            .accordion-button {
                padding: 0.75rem;
            }

            .accordion-body {
                padding: 0.75rem;
            }

            .badge {
                font-size: 0.7rem;
            }

            .btn-sm {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 576px) {

            .part-row {
                flex-direction: row;
                align-items: start;
                gap: 5px;
            }

            .qty-badge {
                align-self: flex-end;
            }
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">


            <div class="row">

                <div class="col-md-3">

                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="all_parts">
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control rounded-3" id="godown" placeholder="">
                        <label for="godown">Vendor </label>
                    </div>

                    <div class="table-responsive" style="max-height: 70vh; overflow-y: auto;">
                        <table class="table small caption-top table-bordered table-striped ">
                            <caption></caption>
                            <thead class="small"
                                style="position: sticky; z-index: 5; top: 0; background-color: #e0ecff;">

                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">
                                        <input type="text" class="form-control form-control-sm rounded-3"
                                            id="part_search" placeholder="Part Name">
                                    </th>
                                    <th scope="col">Qty</th>
                                    <th scope="col" class="d-none">Action</th>

                                </tr>
                            </thead>
                            <tbody class="small" id="dc_parts_tbody">


                            </tbody>


                        </table>
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="table-responsive">
                        <table class="table small caption-top table-bordered table-striped ">
                            <caption>DC In</caption>
                            <thead class="small">

                                <tr>
                                    <th scope="col" colspan="5" id="vendor">Vendor</th>
                                    <th scope="col" id="dc_no">
                                        <input type="text" class="form-control form-control-sm rounded-3" id="in_dc_no"
                                            placeholder="DC/No">
                                    </th>
                                    <th scope="col" id="dc_datee">
                                        <input type="datetime-local" id="dc_date"
                                            class="form-control form-control-sm rounded-3" placeholder="DC Date">
                                    </th>

                                </tr>

                                <tr>
                                    <th scope="col" colspan="5" id="transport_descriptionn">
                                        <input type="text" class="form-control form-control-sm rounded-3"
                                            id="transport_mode" placeholder="Mode Of Transport">
                                    </th>
                                    <th scope="col" id="mode_of_transportt">
                                        <input type="text" class="form-control form-control-sm rounded-3"
                                            id="transport_des" placeholder="Transport Description">

                                    </th>
                                    <th scope="col" id="vehicle_noo">
                                        <input type="text" class="form-control form-control-sm rounded-3"
                                            id="vehicle_no" placeholder="Vehicle/No">
                                    </th>
                                </tr>

                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Part Name</th>
                                    <th scope="col">Process</th>
                                    <th scope="col">Qty</th>
                                    <th scope="col">Rate/Per</th>
                                    <th scope="col">Total Rate</th>
                                    <th scope="col">Delet</th>
                                </tr>

                            </thead>
                            <tbody class="small" id="parts_tbody">

                            </tbody>


                        </table>

                        <button type="button" class="btn btn-primary float-end " id="in_dc_btn">Submit</button>

                    </div>

                </div>

                <div class="col-md-3">
                    <div class="accordion mt-2" id="accordionExample">
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="attachment">
                                <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#attachment_accordion" aria-expanded="true"
                                    aria-controls="attachment_accordion">
                                    Attachments <span class="badge bg-primary ms-3" id="attachment_count"></span>
                                </button>
                            </h2>
                            <div id="attachment_accordion" class="accordion-collapse collapse  show"
                                aria-labelledby="attachment" data-bs-parent="#accordionExample">
                                <div class="accordion-body">

                                    <div class="m-1 d-flex">
                                        <div class="form-check mb-0 bg-secondary border rounded px-2 py-1">
                                            <input class="form-check-input d-none" type="checkbox" id="grid">
                                            <label class="form-check-label text-white" for="grid"
                                                style="cursor:pointer;">
                                                <i class="fa-solid fa-border-all"></i>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="row" id="attachment_list">

                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>


        </div>





    </div>






    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- SWAL FIRE -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- Facnybox -->
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox/fancybox.umd.js"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/dc_in.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
