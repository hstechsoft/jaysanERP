<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        #delar_overall_table tr td {
            vertical-align: middle;
        }

        .table-hover tbody tr:hover {
            transform: scale(1.002);
            transition: 0.2s ease;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
        }

        /* .summary_btn {
            width: 34px;
            height: 34px;
        } */
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="table-responsive">

                <table class="table table-sm align-middle table-hover border mb-0">

                    <thead class="table-dark text-nowrap">

                        <tr>

                            <th width="50">#</th>

                            <th>
                                <i class="fa fa-user me-1"></i>
                                Customer

                                <!-- Search -->
                                <div class="input-group input-group-sm w-100 w-md-auto border border-primary rounded-2 float-end"
                                    style="max-width: 250px;">
                                    <span class="input-group-text bg-white border-0">
                                        <i class="fa fa-search text-muted"></i>
                                    </span>
                                    <input type="text" id="dealer_summary_filter" class="form-control border-0 bg-white"
                                        placeholder="Search...">
                                </div>
                            </th>

                            <th>
                                <i class="fa fa-phone me-1"></i>
                                Phone
                            </th>

                            <th class="text-end">
                                Product
                            </th>

                            <th class="text-end">
                                Spares
                            </th>

                            <th class="text-end ">
                                Paid
                            </th>

                            <th class="text-end color_jay">
                                Balance
                            </th>

                            <th class="text-center" width="80">
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody id="delar_overall_table">

                        <tr>
                            <td colspan="8" class="text-center text-muted py-3">
                                Loading...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>


        </div>




    </div>



    <div class="modal fade" id="summary_modal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Customer Summary</h5>
                    <button class="btn btn-sm btn-danger" data-bs-dismiss="modal">X</button>
                </div>

                <div class="modal-body" id="summary_content">
                    <!-- dynamic content -->
                </div>

                <!-- <div class="modal-footer">
                    <button class="btn btn-success" id="download_pdf">Download PDF</button>
                </div> -->

            </div>
        </div>
    </div>


    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- SWAL FIRE -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/dealer_overall_summary.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
