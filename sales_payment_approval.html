<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <!-- bootsttrap icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
  <title>Document</title>

  <!-- external css -->
  <link rel="stylesheet" type="text/css" href="style.css">

  <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">

<style>
  @media (min-width: 1024px) {
    #large_screen{
      width: 40%;
      margin: 0 auto;
    }
  }
</style>


</head>

<body>

  <section id="menu_bar">

  </section>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header ">
        <strong class="me-auto toast-title">Toast Title</strong>
        <small class="text-muted">Just now</small>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body toast-description">
        Hello, this is a Bootstrap toast message!
      </div>
    </div>
  </div>
  <div class="container-fluid mb-2">
    <!-- top bar -->

    <div class="page-wrapper   mt-5 mt-md-0">

      <div class="d-block d-smm-none" id="large_screen">
        <div class="card">
          <div class="card-header small text-center ">
            payment Approval
          </div>
          <div class="card-body m-0 p-0">
            <ul class="list-group m-0 p-0" id="payment_list" style="font-size: 10px;">


            </ul>
          </div>
        </div>
      </div>

      <!-- content -->
      <div style="max-height: 80vh; overflow-y: auto;" class="d-none d-smm-block">
        <table id='payment_table1' class='table table-bordered  text-center mt-2'>
          <thead class="small">
            <tr class="small">
              <th colspan='9' scope='col' class='text-bg-primary '>Sales Payment Information</th>
            </tr>

            <tr class="small">

              <th scope='col'>#</th>
              <th scope='col'>Customer </th>
              <th scope='col'>Employee</th>
              <th scope='col'>Order No</th>
              <th scope='col'>Payment Date</th>
              <th scope='col'>Ref No</th>
              <th scope='col'>Amount</th>
              <th scope='col'>Approve</th>
              <th scope='col'>Action</th>


            </tr>
          </thead>
          <tbody class='align-middle ' id='payment_table'>

          </tbody>
        </table>
      </div>
    </div>
  </div>
<div id='footer' class="mt-auto"></div>


  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- jQuery UI -->
  <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

  <!-- jQuery UI CSS -->

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
    crossorigin="anonymous"></script>

  <!-- font awesome -->
  <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

  <!-- Sweet alert -->
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>


  <!-- external js -->
  <script src="js/sales_payment_approval.js" type="module"></script>
  <script src="js/menu.js" type="module"></script>
  <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
