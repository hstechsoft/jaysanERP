<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        table tr,
        th {
            font-size: 12px;
            vertical-align: middle;
            text-align: center;
        }

        #work_nesting_details_tbody td,
        #work_nesting_details_tbody th{
            text-align: center;
            vertical-align: middle;
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="row">

                <div class="col-12">

                    <div class="table-responsive" style="max-height: 90vh; overflow-y: auto;">
                        <table class="table caption-top table-bordered table-striped ">
                            <caption></caption>
                            <thead style="position: sticky; z-index: 5; top: 0; background-color: rgb(214, 229, 241);">

                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">
                                        <div class="input-group input-group-sm">
                                            <span class="input-group-text">
                                                <i class="fa-solid fa-object-group"></i>
                                            </span>
                                            <input type="text" class="form-control" id="nesting_name"
                                                placeholder="Nesting Name">
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="input-group input-group-sm">
                                            <span class="input-group-text">
                                                <i class="fa-solid fa-cubes"></i>
                                            </span>
                                            <input type="text" class="form-control" id="material_id"
                                                placeholder="Material">
                                        </div>
                                    </th>
                                    <th scope="col">Material Qty</th>
                                    <th scope="col">Process Time</th>
                                    <th scope="col">Type</th>
                                    <th scope="col">
                                        <div class="input-group input-group-sm">
                                            <span class="input-group-text">
                                                <i class="fa-solid fa-users"></i>
                                            </span>
                                            <input type="text" class="form-control" id="employee"
                                                placeholder="Employee">
                                        </div>
                                    </th>
                                    <th scope="col">Nested Parts</th>
                                    <th scope="col">Job Card</th>
                                    <th scope="col">
                                        <input class="form-check-input" type="checkbox" id="pending">
                                    </th>

                                </tr>
                            </thead>
                            <tbody id="work_nesting_details_tbody">




                            </tbody>


                        </table>
                    </div>

                </div>

            </div>

        </div>




    </div>




    <div id='footer' class="mt-auto"></div>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/laser_dashboard.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
