<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>
    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .sortable-placeholder {
            background: #f0f8ff;
            height: 50px;
            border: 2px dashed #0d6efd;
        }

        @media (max-width: 767px) {

            table tr td,
            table tr th {
                font-size: 10px;
                padding: 1px !important;
            }
        }
    </style>

</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid " style="height: 100%; overflow-y: auto;">
        <!-- top bar -->










        <div class="page-wrapper mt-5 mt-md-0">

            <div class="container py-2">

                <div class="row justify-content-center">

                    <div class="col-md-8">

                        <div class="text-center">
                            <h6 class="fw-bold text-primary">
                                <i class="fa-solid fa-screwdriver-wrench me-2"></i>
                                Production Line Order Change
                            </h6>
                        </div>

                        <div class="card shadow-sm rounded-4">
                            <div class="card-body p-0">

                                <div class="table-responsive">
                                    <table class="table small table-bordered table-striped align-middle">

                                        <thead class="table-primary small text-center"
                                            style="position: sticky; top:0; z-index: 5; background-color: rgb(244, 244, 244);">
                                            <tr>
                                                <th style="width: 1%;">
                                                    <i class="fa-solid fa-hashtag"></i>
                                                </th>

                                                <th style="width: 60%;">

                                                    <div class="d-flex align-items-center justify-content-between">

                                                        <!-- Customer Label -->
                                                        <div class="d-flex align-items-center">
                                                            <i class="fa-solid fa-user-group me-1"></i>
                                                            <span>Customer</span>
                                                        </div>

                                                        <!-- Small Date Field -->
                                                        <div class="ms-2" style="width: 150px;">
                                                            <div class="form-floating">
                                                                <input type="date"
                                                                    class="form-control form-control-sm rounded-3"
                                                                    id="arrange_date" style="height: 38px;">
                                                                <label for="arrange_date" class="small"
                                                                    style="top: -5px;">
                                                                    <i class="fa-regular fa-calendar-days me-1"></i>
                                                                    Date
                                                                </label>
                                                            </div>
                                                        </div>

                                                    </div>

                                                </th>

                                                <th>
                                                    <i class="fa-solid fa-industry me-1"></i> Machine Details
                                                </th>
                                            </tr>
                                        </thead>

                                        <tbody class="small" id="arrange_order_tbody">
                                            <!-- JS Inserts Rows Here -->
                                        </tbody>

                                    </table>
                                </div>

                            </div>
                        </div>

                    </div>

                </div>

            </div>






        </div>

    </div>

    <div id='footer' class="mt-auto">



    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
    <!-- external js -->
    <script src="js/production_order_arrangement_form.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
