<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        /* Compact Stock Accordion */
        #stock_dashboard_tboady .accordion {
            margin: 0;
        }

        #stock_dashboard_tboady .accordion-item {
            border-radius: 0;
            border: 1px solid #dee2e6;
            margin-bottom: 2px;
        }

        /* Accordion Header */
        #stock_dashboard_tboady .accordion-button {
            padding: 5px 8px;
            font-size: 12px;
            line-height: 1.2;
            min-height: 32px;
            box-shadow: none !important;
        }

        /* Remove large Bootstrap arrow area */
        #stock_dashboard_tboady .accordion-button::after {
            width: 12px;
            height: 12px;
            background-size: 12px;
        }

        /* Accordion Body */
        #stock_dashboard_tboady .accordion-body {
            padding: 6px 8px;
            font-size: 11px;
        }

        /* Location section */
        #stock_dashboard_tboady .accordion-body .mb-3 {
            margin-bottom: 5px !important;
        }

        /* Section headings */
        #stock_dashboard_tboady .accordion-body .fw-bold {
            font-size: 11px;
            margin-bottom: 3px !important;
        }

        /* Location box */
        #stock_dashboard_tboady .accordion-body .border.rounded {
            padding: 4px 6px !important;
        }

        /* Reduce row spacing */
        #stock_dashboard_tboady .accordion-body .row {
            --bs-gutter-x: 5px;
            --bs-gutter-y: 3px;
        }

        /* List groups */
        #stock_dashboard_tboady .accordion-body .list-group-item {
            padding: 4px 6px;
            font-size: 11px;
            line-height: 1.2;
        }

        /* Compact badges */
        #stock_dashboard_tboady .badge {
            font-size: 10px;
            padding: 3px 5px;
            vertical-align: middle;
        }

        /* Reduce badge margins */
        #stock_dashboard_tboady .mx-1 {
            margin-left: 2px !important;
            margin-right: 2px !important;
        }

        #stock_dashboard_tboady .mx-2 {
            margin-left: 3px !important;
            margin-right: 3px !important;
        }

        /* Compact stock location text */
        #stock_dashboard_tboady .accordion-body strong {
            font-size: 10px;
        }

        /* Make accordion header contents fit in one line */
        #stock_dashboard_tboady .accordion-button .d-flex {
            gap: 4px;
        }

        #stock_dashboard_tboady .accordion-button .fw-semibold {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Remove unnecessary background on accordion body */
        #stock_dashboard_tboady .accordion-body {
            background: #fff;
        }

        /* Smaller table cells */
        #stock_dashboard_tboady>tr>td {
            padding: 5px 6px;
            vertical-align: middle;
        }

        #stock_dashboard_tboady .accordion-button {
            padding: 3px 6px;
            font-size: 11px;
            min-height: 28px;
        }

        #stock_dashboard_tboady .accordion-body {
            padding: 4px 6px;
        }

        #stock_dashboard_tboady .accordion-body .list-group-item {
            padding: 3px 5px;
            font-size: 10px;
        }

        #stock_dashboard_tboady .badge {
            font-size: 9px;
            padding: 2px 4px;
        }
    </style>

</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>

    <section id="menu_bar"></section>
    <div class="container-fluid " style="height: 100%; overflow-y: auto;">
        <!-- top bar -->








        <div class="page-wrapper">


            <div class="stock_dashboard">

                <div class="row">

                    <div class="col-md-3">

                        <div class="card border-0 shadow-sm rounded-3">

                            <div class="card-header bg-primary text-white py-2 px-3">
                                <div class="d-flex align-items-center">
                                    <i class="fa-solid fa-filter me-2"></i>
                                    <span class="fw-semibold">Stock Filter</span>
                                </div>
                            </div>

                            <div class="card-body p-2">

                                <!-- Godown -->
                                <div class="input-group input-group-sm mb-3">
                                    <input type="text" class="form-control" id="godown"
                                        placeholder="Godown">
                                </div>

                                <!-- Department -->
                                <div class="input-group input-group-sm mb-3">
                                    <input type="text" class="form-control" id="department"
                                        placeholder="Department">
                                </div>

                                <!-- Section -->
                                <div class="input-group input-group-sm mb-3">
                                    <input type="text" class="form-control" id="section"
                                        placeholder="Section">
                                </div>

                                <!-- Part Name -->
                                <div class="input-group input-group-sm mb-3">
                                    <input type="text" class="form-control" id="part_name"
                                        placeholder="Part Name">
                                </div>

                                <!-- Hidden Qty -->
                                <div class="input-group input-group-sm mb-3 d-none">
                                    <input type="number" class="form-control" min="1"
                                        id="opening_qty" placeholder="Qty">
                                </div>

                                <!-- Buttons -->
                                <div class="d-flex gap-2 pt-1">

                                    <button type="button" class="btn btn-primary btn-sm flex-fill" id="filter_btn">

                                        <i class="fa-solid fa-filter me-1"></i>
                                        Filter

                                    </button>

                                    <button type="button" class="btn btn-warning btn-sm flex-fill" id="clear_btn">

                                        <i class="fa-solid fa-broom me-1"></i>
                                        Clear

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-9">

                        <div class="table-responsive">
                            <table class="table caption-top table-bordered table-striped small">

                                <caption></caption>

                                <thead class="table-primary small">

                                    <tr>
                                        <th scope="col">#</th>
                                        <th scope="col">Part Name</th>
                                        <th scope="col">Total Qty</th>
                                        <th scope="col" colspan="3">Stock Details</th>
                                    </tr>

                                </thead>

                                <tbody id="stock_dashboard_tboady" class="small">
                                </tbody>

                            </table>
                        </div>

                    </div>

                </div>


            </div>

            <!-- content -->
            <div class="d-none">
                <div class="d-flex">
                    <div class=" m-1">
                        <input type="text" class="form-control rounded-3" id="part_search" placeholder="Part">
                    </div>
                    <div class=" m-1">
                        <input type="text" class="form-control rounded-3" id="emp_search" placeholder="Employee">
                    </div>
                    <div class="m-1">
                        <button type="button" class="btn btn-success " id="excel_bnt"><i
                                class="fa fa-file-excel"></i></button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table caption-top table-bordered table-striped " style="font-size: 12px;">
                        <thead>
                            <tr>
                                <th style="width: 5%;"> <input type="text" id="stock_history_search"
                                        class="form-control border-0 bg-white" placeholder="Search..."></th>
                                <th>Part</th>
                                <th>Date</th>
                                <th>Action</th>
                                <th>Godown</th>
                                <th>Department</th>
                                <th>Section</th>
                                <th>Qty</th>
                                <th>Employee</th>
                                <th>Remark</th>
                            </tr>
                        </thead>

                        <tbody id="stock_history_tbody">


                        </tbody>


                    </table>
                </div>
            </div>


        </div>


        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- jQuery UI -->
        <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

        <!-- jQuery UI CSS -->

        <!-- bootstrap include -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
            integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
            integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
            crossorigin="anonymous"></script>

        <!-- font awesome -->
        <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

        <!-- Sweet alert -->
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


        <!-- external js -->
        <script src="js/stock_history.js" type="module"></script>
        <script src="js/menu.js" type="module"></script>
        <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
