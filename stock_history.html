<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        #purchase_order_table tr {
            font-size: 12px;
        }
    </style>

</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>

        <section id="menu_bar" ></section>
    <div class="container-fluid " style="height: 100%; overflow-y: auto;">
        <!-- top bar -->








        <div class="page-wrapper">

            <!-- content -->
            <div class="d-flex">
                <div class=" m-1">
                    <input type="text" class="form-control rounded-3" id="part_search" placeholder="Part">
                </div>
                <div class=" m-1">
                    <input type="text" class="form-control rounded-3" id="emp_search" placeholder="Employee">
                </div>
                <div class="m-1">
                    <button type="button" class="btn btn-success " id="excel_bnt"><i
                            class="fa fa-file-excel"></i></button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table caption-top table-bordered table-striped " style="font-size: 12px;">
                    <thead>
                        <tr>
                            <th style="width: 5%;"> <input type="text" id="stock_history_search" class="form-control border-0 bg-white"
                                    placeholder="Search..."></th>
                            <th>Part</th>
                            <th>Date</th>
                            <th>Action</th>
                            <th>Godown</th>
                            <th>Department</th>
                            <th>Section</th>
                            <th>Qty</th>
                            <th>Employee</th>
                            <th>Remark</th>
                        </tr>
                    </thead>

                    <tbody id="stock_history_tbody">


                    </tbody>


                </table>
            </div>


        </div>


        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- jQuery UI -->
        <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

        <!-- jQuery UI CSS -->

        <!-- bootstrap include -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
            integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
            integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
            crossorigin="anonymous"></script>

        <!-- font awesome -->
        <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

        <!-- Sweet alert -->
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


        <!-- external js -->
        <script src="js/stock_history.js" type="module"></script>
        <script src="js/menu.js" type="module"></script>
        <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
