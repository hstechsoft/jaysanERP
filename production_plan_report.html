<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .production-report-wrapper {
            max-height: 80vh;
            overflow: auto;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }

        .production-table {
            font-size: 12px;
            margin-bottom: 0;
            min-width: 1200px;
        }

        .production-table thead th {
            position: sticky;
            top: 0;
            z-index: 5;
            background: #eaf2ff;
            color: #344563;
            font-weight: 700;
            white-space: nowrap;
            padding: 11px 9px;
            border-bottom: 2px solid #cbd7e8;
        }

        .production-table tbody td {
            padding: 10px 9px;
            vertical-align: middle;
            background: #fff;
        }

        .production-table tbody tr:hover>td {
            background: #f7faff;
        }

        .product-title {
            font-weight: 700;
            color: #243b53;
            font-size: 13px;
        }

        .info-line {
            margin-top: 4px;
            color: #64748b;
            font-size: 11px;
        }

        .info-line strong {
            color: #334155;
            font-weight: 600;
        }

        .planner-id {
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            border-radius: 4px;
            padding: 3px 6px;
            font-weight: 600;
            margin-top: 5px;
        }

        .order-item {
            padding: 6px 8px;
            border: 1px solid #e5eaf0;
            border-radius: 5px;
            margin-bottom: 5px;
            background: #fafcff;
        }

        .order-item:last-child {
            margin-bottom: 0;
        }

        .order-heading {
            font-weight: 700;
            color: #2563eb;
        }

        .godown-item {
            margin-bottom: 5px;
            padding: 5px 7px;
            background: #f8fafc;
            border-left: 3px solid #94a3b8;
            border-radius: 3px;
        }

        .godown-item:last-child {
            margin-bottom: 0;
        }

        .commit-date {
            font-size: 13px;
            font-weight: 700;
            color: #15803d;
        }

        .request-count {
            display: inline-block;
            background: #fff7ed;
            color: #c2410c;
            padding: 4px 8px;
            border-radius: 5px;
            font-weight: 700;
            margin-top: 5px;
        }

        .summary-block {
            min-width: 270px;
            margin-bottom: 12px;
        }

        .summary-block:last-child {
            margin-bottom: 0;
        }

        .summary-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #475569;
        }

        .summary-total {
            color: #0f172a;
            font-size: 12px;
        }

        .progress {
            height: 17px;
            border-radius: 4px;
            background: #e9eef5;
            overflow: hidden;
            display: flex;
        }

        .progress-segment {
            height: 100%;
            border: 0;
            padding: 0;
            cursor: pointer;
            color: white;
            font-size: 10px;
            font-weight: 700;
            transition: filter .2s;
            overflow: hidden;
            white-space: nowrap;
        }

        .progress-segment:hover {
            filter: brightness(.85);
        }

        .assigned-segment {
            background: #198754;
        }

        .unassigned-segment {
            background: #f59e0b;
        }

        .completed-segment {
            background: #0d9488;
        }

        .pending-segment {
            background: #64748b;
        }

        .summary-legend {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-top: 5px;
            color: #64748b;
        }

        .legend-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 3px;
        }

        .detail-row>td {
            background: #f5f8fc !important;
            padding: 12px 18px !important;
        }

        .detail-container {
            border: 1px solid #dce5ef;
            border-radius: 7px;
            background: white;
            overflow: hidden;
        }

        .detail-header {
            padding: 9px 12px;
            background: #edf3fa;
            font-weight: 700;
            color: #334155;
            display: flex;
            justify-content: space-between;
        }

        .part-table {
            margin-bottom: 0;
            font-size: 11px;
        }

        .part-table th {
            background: #f8fafc;
            color: #475569;
            white-space: nowrap;
        }

        .part-table td,
        .part-table th {
            padding: 7px 9px;
        }

        .qty-badge {
            display: inline-block;
            padding: 3px 7px;
            border-radius: 4px;
            font-weight: 700;
            white-space: nowrap;
        }

        .qty-success {
            background: #dcfce7;
            color: #166534;
        }

        .qty-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .qty-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .wo-item {
            border-left: 2px solid #cbd5e1;
            padding: 3px 7px;
            margin-bottom: 4px;
            background: #f8fafc;
        }

        .no-data {
            color: #94a3b8;
            font-style: italic;
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">
            <!-- 
            <div class="d-flex mb-1">
                <div>
                    <input type="text" class="form-control rounded-3 form-control-sm float-end" id="dc_report_search"
                        placeholder="Search...">
                </div>
            </div> -->

            <div class="table-responsive production-report-wrapper">
                <table class="table table-bordered table-hover align-middle production-table">
                    <thead>
                        <tr>
                            <th width="40">#</th>
                            <th>Product Details</th>
                            <th>Created By & Planner</th>
                            <th>Order Details</th>
                            <th>Godown Details</th>
                            <th>Commit Date & Requests</th>
                            <th style="min-width:300px;">Total Input Summary</th>
                        </tr>
                    </thead>
                    <tbody id="production_plan_report_tbody"></tbody>
                </table>
            </div>



        </div>



    </div>



    <div id='footer' class="mt-auto"></div>
