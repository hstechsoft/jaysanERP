<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://polyfill.io/v3/polyfill.min.js?features=default"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-auth.js"></script>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <!-- bootsttrap icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
  <title>Document</title>

  <!-- external css -->
  <link rel="stylesheet" type="text/css" href="style.css">

  <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">

  <style>
    @media (max-width: 767px) {
      .table>:not(caption)>*>* {
        padding: 3px;
      }

      .input-group {
        width: 100% !important;
      }
    }
  </style>



</head>

<body onload=" ">

  <section id="menu_bar">

  </section>

  <div class="container-fluid mb-2">
    <!-- top bar -->



    <!-- navbar -->



    <div class="modal modal-lg " id="history_model">
      <div class="modal-dialog">
        <div class="modal-content">

          <!-- Modal Header -->
          <div class="modal-header">
            <h4 class="modal-title">History</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <!-- Modal body -->
          <div class="modal-body overflow-scroll">
            <div>
              <table id="exp_payment_tbl1"
                class="table  small table-bordered border-dark border-opacity-50 text-center ">
                <thead class="small">
                  <tr>

                    <th colspan="3" scope="col" class="bg-info bg-opacity-25">Employee Payment History</th>

                  </tr>
                  <tr>

                  </tr>
                  <tr>

                    <th scope="col">#</th>
                    <th scope="col">Date</th>
                    <th scope="col">Amount</th>




                  </tr>
                </thead>
                <tbody class="align-middle small" id="exp_payment_tbl">



                </tbody>
              </table>
            </div>
          </div>

          <!-- Modal footer -->
          <div class="modal-footer">
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
          </div>

        </div>
      </div>
    </div>


    <div class="modal modal-lg " id="emp_pay_model">
      <div class="modal-dialog">
        <div class="modal-content">

          <!-- Modal Header -->
          <div class="modal-header">
            <h4 class="modal-title">Payment</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <!-- Modal body -->
          <div class="modal-body overflow-scroll">
            <div>

              <div class="input-group mb-3">
                <label class="input-group-text" for="emp_pay_amount"><span>
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                  </span>
                </label>
                <input id="emp_pay_amount" type="number" class="form-control" placeholder="Amount" aria-label="Username"
                  aria-describedby="basic-addon1">
              </div>


              <div class="input-group my-3 ">

                <label class="input-group-text" for="pay_date"><span>
                    <i class="fa-solid fa-calendar-days h6"></i>
                  </span></label>
                <input type="datetime-local" id="pay_date" class="form-control" aria-label="Username"
                  aria-describedby="basic-addon1" required>
              </div>
              <button type="button" id="submit_emp_btn" class="btn btn-primary float-end"><i
                  class="fa-solid fa-plus"></i> Submit</button>
            </div>
          </div>

          <!-- Modal footer -->
          <div class="modal-footer">
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
          </div>

        </div>
      </div>
    </div>
    <div class="page-wrapper mt-5 mt-md-0">
      <div class="card mt-3 ">
        <div class="card-header">
          <div class="d-md-flex justify-content-between align-items-center">

            <div class="input-group  w-25">
              <label class="input-group-text" for="sel_usr_in"><span>
                  <i class="fa-solid fa-briefcase h6"></i>
                </span></label>

              <input type="text" class="form-control" placeholder="Employee" id="sel_usr_in">
              <!-- <select class="form-select" id="sel_usr_in">
                <option selected>Select User</option>
              </select> -->
            </div>
            <h6 id="selected_usr"></h6>
            <button type="button" id="pay_emp_btn" class="btn btn-primary mb-2 mb-md-0 btn-sm"><i
                class="fa-solid fa-plus"></i> Pay</button>
            <button class="btn btn-primary mb-2 mb-md-0 btn-sm" id="view_history_btn"><i
                class="fa-solid fa-book-open"></i> History</button>
            <div class="input-group  w-25">
              <label class="input-group-text" for="sel_exp_sts_in"><span>
                  <i class="fa-solid fa-briefcase h6"></i>
                </span></label>
              <select class="form-select" id="sel_exp_sts_in">
                <option value="0" selected>Select Status</option>
                <option value="yes">Approved</option>
                <option value="no">Un Approved</option>
                <option value="decline">Declined</option>
              </select>
            </div>

          </div>


        </div>
        <div class="card-body table_report d-flex justify-content-between gap-2">

          <table id="exp_table_single1" class="table small  table-bordered border-dark border-opacity-50 text-center ">
            <thead>
              <tr>

                <th colspan="7" scope="col" class="bg-info bg-opacity-25 small">Employee Expense Status</th>

              </tr>
              <tr>

              </tr>
              <tr>

                <th scope="col">#</th>
                <th scope="col">Date</th>
                <th scope="col">Description</th>

                <th scope="col">Amount</th>
                <th scope="col">Status</th>
                <th scope="col">Image</th>
                <th scope="col">
                  <input class="form-check-input" type="checkbox" id="sel_all_chk" value="">
                </th>


              </tr>
            </thead>
            <tbody class="align-middle small" id="exp_table_single">



            </tbody>
          </table>



        </div>
        <div class="card-footer">
          <div class="d-flex justify-content-center gap-2">
            <div class="input-group w-25">
              <label class="input-group-text" for="sel_expc_sts_in"><span>
                  <i class="fa-solid fa-briefcase h6"></i>
                </span></label>
              <select class="form-select" id="sel_expc_sts_in">
                <option value="0" selected>Select Status</option>
                <option value="yes">Approved</option>

                <option value="decline">Declined</option>
              </select>
            </div>
            <div>
              <button type="button" id="submit_exp_btn" class="btn btn-primary">Submit</button>
            </div>

          </div>
        </div>
      </div>


    </div>
  </div>

  <div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Bill Preview</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body text-center" style="overflow:hidden;">
          <img id="previewImage" src="" style="max-width:100%; max-height:80vh; cursor:grab;">
        </div>

      </div>
    </div>
  </div>
  <!-- content -->
  <div id='footer' class="mt-auto"></div>



  <!-- jquery -->
  <script type="text/javascript" src="//code.jquery.com/jquery-1.11.0.min.js"></script>
  <script type="text/javascript" src="//code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
  <script src="//code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

  <!-- bootstrap include -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
    crossorigin="anonymous"></script>

  <!-- font awesome -->
  <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

  <!-- Sweet alert -->
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
  <!-- zoom in and out -->
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>


  <!-- external js -->
  <script src="js/admin_expense_single.js" type="module"></script>
  <script src="js/menu.js" type="module"></script>

</body>

</html>
