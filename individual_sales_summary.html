<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .card {
            transition: 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .form-control-sm {
            font-size: 13px;
            padding: 6px 10px;
        }

        .table th {
            font-size: 13px;
            font-weight: 600;
        }

        .table td {
            font-size: 13px;
        }

        thead.sticky-top {
            top: 0;
            z-index: 2;
        }

        @media (max-width: 768px) {
            .card-body {
                padding: 12px !important;
            }

            h6 {
                font-size: 14px;
            }

            .table th {
                font-size: 10px;
            }

            .table td {
                font-size: 10px;
            }
        }


        .product-card {
            transition: 0.2s ease;
            background: #c0e6ff !important;
        }


        .product-card:hover {
            transform: translateY(-2px);
            transition: 0.5s ease-in;
            background-color: #d0d1fa !important;
        }

        .product-card .badge {
            font-size: 11px;
        }

        .product-card .small {
            font-size: 12px;
        }

        /* chart / graph */
        .card,
        .dashboard-card {
            border-radius: 14px;
            padding: 20px;
            margin-top: 5px;
            margin-bottom: 5px;
            border: none;
            background: #ffffff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            transition: all 0.25s ease;
        }

        .card:hover,
        .dashboard-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
        }

        /* ========== ICON ANIMATION ========== */
        .dashboard-card h6 i {
            margin-right: 6px;
            transition: 0.3s;
        }

        .dashboard-card:hover i {
            transform: rotate(10deg) scale(1.2);
            color: #0d6efd;
        }

        .chart-box {
            position: relative;
            height: 320px;
            width: 100%;
        }

        .summary-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .summary-item {
            flex: 1;
            text-align: center;
            padding: 6px;
            border-radius: 8px;
            font-size: 12px;
        }

        .summary-item b {
            display: block;
        }

        .head {
            position: sticky;
            z-index: 5;
            top: 0;
            background-color: #c0e6ff;
        }

        canvas {
            max-width: 100% !important;
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="container-fluid py-2">


                <div class="row graph">
                    <div class="col-12">
                        <div class="dashboard-card">
                            <h6 class="text-center">📈 Monthly Sales</h6>
                            <div class="chart-box">
                                <canvas id="monthChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="dashboard-card">
                            <h6 class="text-center">👨‍💼 Employee Sales</h6>
                            <div class="card-body">
                                <div class="chart-box">
                                    <canvas id="employeeChart"></canvas>
                                </div>
                            </div>
                            <div class="card-footer">
                                <div id="employeeSummary"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="dashboard-card">
                            <h6 class="text-center">🧑‍🤝‍🧑 Customer Sales</h6>
                            <div class="card-body">
                                <div class="chart-box">
                                    <canvas id="customerChart"></canvas>
                                </div>
                            </div>
                            <div class="card-footer">
                                <div id="customerSummary"></div>
                            </div>
                        </div>

                    </div>

                    <div class="col-12">
                        <div class="dashboard-card">
                            <h6 class="text-center mb-3">📦 Product Sales</h6>

                            <div class="row align-items-stretch">

                                <!-- 🔹 CHART -->
                                <div class="col-lg-5 col-md-6 col-12 mb-3 mb-md-0">
                                    <div class="chart-container d-flex justify-content-center align-items-center">
                                        <canvas id="productChart" style="max-width: 350; max-height: 400px;"></canvas>
                                    </div>
                                </div>

                                <!-- 🔹 TABLE -->
                                <div class="col-lg-7 col-md-6 col-12">
                                    <div class="table-container">
                                        <div id="productSummary"></div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>


                <div class="row g-3">

                    <!-- 🔹 FILTER PANEL -->
                    <div class="col-lg-3 col-md-4 col-12">

                        <div class="card shadow-sm border-0 rounded-4 ">
                            <div class="card-body p-0">

                                <h6 class="fw-bold text-primary mb-3">🔍 Filters</h6>

                                <!-- <div class="form-floating mb-2">
                                    <input type="text" class="form-control form-control-sm" id="employee">
                                    <label>Employee</label>
                                </div> -->

                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control form-control-sm" id="customer">
                                    <label>Customer</label>
                                </div>

                                <div class="form-floating mb-2">
                                    <select class="form-select" id="product">
                                        <option selected value="">Choose...</option>
                                    </select>
                                    <label for="product">Product</label>
                                </div>

                                <div class="form-floating mb-2">
                                    <select class="form-select" id="model">
                                        <option selected value="">Choose...</option>
                                    </select>
                                    <label for="model">Modael</label>
                                </div>

                                <div class="form-floating mb-2">
                                    <select class="form-select" id="type">
                                        <option selected value="">Choose...</option>
                                    </select>
                                    <label for="type">Type</label>
                                </div>

                                <!-- Dates -->
                                <div class="row g-2 mb-2">
                                    <div class="col-6">
                                        <div class="form-floating">
                                            <input type="date" class="form-control form-control-sm" id="f_date">
                                            <label>From</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-floating">
                                            <input type="date" class="form-control form-control-sm" id="e_date">
                                            <label>To</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button class="btn btn-primary w-100 rounded-3 py-2" id="generate_summary">
                                        <i class="fa-solid fa-chart-line me-1"></i> Generate
                                    </button>
                                    <button class="btn btn-warning w-100 rounded-3 py-2"
                                        onclick="window.location.reload()">
                                        <i class="fa-solid fa-broom"></i> Clear
                                    </button>
                                </div>

                            </div>
                        </div>

                    </div>

                    <!-- 🔹 TABLE PANEL -->
                    <div class="col-lg-9 col-md-8 col-12">

                        <div class="card shadow-sm border-0 rounded-4">

                            <div class="card-header bg-white border-0 py-2 px-3">
                                <h6 class="mb-0 fw-bold text-secondary">📊 Sales Summary</h6>
                            </div>

                            <div class="table-responsive" style="max-height: 58vh;">

                                <table
                                    class="table caption-top table-bordered table-striped table-sm align-middle mb-0">

                                    <thead class="table-light sticky-top small">
                                        <tr>
                                            <th>#</th>
                                            <th>Product <input type="text" class="float-end" id="sales_summary_search"
                                                    placeholder="Search"></th>
                                            <th>Qty</th>
                                            <th id="thead_price">Price</th>
                                        </tr>
                                    </thead>

                                    <tbody id="sales_.36a   999summary_tbody" class="small">

                                    </tbody>

                                </table>

                            </div>

                        </div>

                    </div>

                </div>




            </div>

        </div>




    </div>


    <div id="priceTotalCard" style="position: fixed; top: 265px; right: 17%; 
            background:rgba(255, 188, 2, 0.253); border-radius:6px; color: #0c9212;
            padding:12px 18px; font-weight:bold; 
            box-shadow:0 0 10px rgba(0,0,0,0.2); 
            display:none; z-index:999">

        <div id='footer' class="mt-auto"></div>


        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- jQuery UI -->
        <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

        <!-- jQuery UI CSS -->

        <!-- bootstrap include -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
            integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
            integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
            crossorigin="anonymous"></script>


        <!-- font awesome -->
        <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

        <!-- Sweet alert -->
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


        <!-- graph -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
        <script src="https://code.highcharts.com/highcharts.js"></script>
        <script src="https://code.highcharts.com/highcharts-3d.js"></script>

        <!-- external js -->
        <script src="js/individual_sales_summary.js" type="module"></script>
        <script src="js/menu.js" type="module"></script>
        <!-- <script src="js/get_all_id.js" type="module"></script> -->


</body>

</html>
