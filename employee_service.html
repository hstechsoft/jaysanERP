<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <!-- bootsttrap icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
  <title>Document</title>

  <!-- external css -->
  <link rel="stylesheet" type="text/css" href="style.css">

  <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


  <style>
    body {
      background: #f5f7fb;
      font-size: 13px;
    }

    /* CARD */
    .card {
      border-radius: 12px !important;
      overflow: hidden;
    }

    /* FORM */
    .form-floating {
      margin-bottom: 6px !important;
    }

    .form-control,
    .form-select {
      min-height: 38px !important;
      height: 38px !important;
      padding: 6px 10px !important;
      font-size: 12px !important;
      border-radius: 8px !important;
    }

    .form-floating label {
      padding: 8px 10px !important;
      font-size: 12px;
    }

    /* BUTTON */
    .btn {
      height: 38px;
      padding: 4px 10px !important;
      font-size: 12px !important;
      border-radius: 8px !important;
    }

    /* TABLE */
    .table {
      margin-bottom: 0 !important;
    }

    .table th {
      font-size: 12px;
      padding: 6px !important;
      white-space: nowrap;
    }

    .table td {
      font-size: 12px;
      padding: 5px !important;
      vertical-align: middle;
    }

    /* CARD BODY */
    .card-body {
      padding: 10px !important;
    }

    /* HEADINGS */
    h5 {
      font-size: 16px;
      margin-bottom: 8px !important;
    }

    h6 {
      font-size: 13px;
      margin-bottom: 8px !important;
    }

    /* ROW GAP */
    .row {
      --bs-gutter-x: .5rem !important;
      --bs-gutter-y: .5rem !important;
    }

    /* MOBILE */
    @media(max-width:768px) {

      .form-control,
      .form-select {
        font-size: 11px !important;
      }

      .table th,
      .table td {
        font-size: 11px;
        padding: 4px !important;
      }

      .btn {
        font-size: 11px !important;
      }

    }
  </style>



</head>

<body>
  <section>

  </section>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header ">
        <strong class="me-auto toast-title">Toast Title</strong>
        <small class="text-muted">Just now</small>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body toast-description">
        Hello, this is a Bootstrap toast message!
      </div>
    </div>
  </div>
  <section id="menu_bar"></section>
  <div class="container-fluid mb-2">
    <!-- top bar -->


    <div class=" page-wrapper mt-5 mt-md-0">


      <div class="row g-3">

        <!-- LEFT SIDE -->
        <div class="col-12 col-lg-4">

          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body">

              <h5 class="fw-bold text-primary mb-3">
                Service Entry
              </h5>

              <!-- Dealer -->
              <div class="form-floating mb-2">
                <input type="text" class="form-control rounded-3" id="dealer_name" placeholder="Dealer">
                <label for="dealer_name">Dealer</label>
              </div>

              <!-- Customer -->
              <div class="form-floating mb-2">
                <input type="text" class="form-control rounded-3" id="customer_name" placeholder="Customer">
                <label for="customer_name">Customer</label>
              </div>

              <!-- Phone -->
              <div class="form-floating mb-2">
                <input type="number" class="form-control rounded-3" id="customer_number" placeholder="Phone">
                <label for="customer_number">Customer Phone</label>
              </div>

              <!-- Place -->
              <div class="form-floating mb-2">
                <input type="text" class="form-control rounded-3" id="place" placeholder="Place">
                <label for="place">Place Of Service</label>
              </div>

              <!-- Implement -->
              <div class="form-floating mb-2">
                <select class="form-select rounded-3" id="implement">
                  <option selected disabled value="">Choose...</option>
                </select>
                <label for="implement">Implement</label>
              </div>

              <!-- Service Date -->
              <div class="form-floating mb-3">
                <input type="datetime-local" class="form-control rounded-3" id="service_date">
                <label for="service_date">Service Date</label>
              </div>

              <!-- Problem Section -->
              <div class="card border-0 bg-light rounded-4 mb-3">
                <div class="card-body p-3">

                  <h6 class="fw-semibold mb-3 text-secondary">
                    Problems
                  </h6>

                  <div class="row g-2 align-items-center">

                    <div class="col-9">
                      <div class="form-floating">
                        <select class="form-select rounded-3" id="problem">
                          <option selected disabled value="">Choose...</option>
                        </select>
                        <label for="problem">Problem</label>
                      </div>
                    </div>

                    <div class="col-3 d-grid">
                      <button type="button" class="btn btn-primary rounded-3 h-100" id="add_problem_btn">
                        +
                      </button>
                    </div>

                  </div>

                  <div class="table-responsive mt-3">
                    <table class="table table-sm table-bordered align-middle mb-0">
                      <thead class="table-primary">
                        <tr>
                          <th width="10%">#</th>
                          <th>Problem</th>
                          <th width="20%">Action</th>
                        </tr>
                      </thead>

                      <tbody id="problem_table_body">
                        <tr>
                          <td colspan="3" class="text-center text-muted">
                            No Problems Added
                          </td>
                        </tr>
                      </tbody>

                    </table>
                  </div>

                </div>
              </div>

              <!-- Employee Section -->
              <div class="card border-0 bg-light rounded-4 mb-3">
                <div class="card-body p-3">

                  <h6 class="fw-semibold mb-3 text-secondary">
                    Service Persons
                  </h6>

                  <div class="row g-2 align-items-center">

                    <div class="col-9">
                      <div class="form-floating">
                        <select class="form-select rounded-3" id="employee">
                          <option selected disabled value="">Choose...</option>
                        </select>
                        <label for="employee">Service Person</label>
                      </div>
                    </div>

                    <div class="col-3 d-grid">
                      <button type="button" class="btn btn-primary rounded-3 h-100" id="add_employee_btn">
                        +
                      </button>
                    </div>

                  </div>

                  <div class="table-responsive mt-3">
                    <table class="table table-sm table-bordered align-middle mb-0">
                      <thead class="table-primary">
                        <tr>
                          <th width="10%">#</th>
                          <th>Service Person</th>
                          <th width="20%">Action</th>
                        </tr>
                      </thead>

                      <tbody id="employee_table_body">
                        <tr>
                          <td colspan="3" class="text-center text-muted">
                            No Service Person Added
                          </td>
                        </tr>
                      </tbody>

                    </table>
                  </div>

                </div>
              </div>

              <!-- Submit -->
              <div class="d-grid">
                <button type="button" class="btn btn-primary btn-lg rounded-3 shadow-sm" id="add_service_details_btn">

                  Add Service Details

                </button>
              </div>

            </div>
          </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="col-12 col-lg-8">

          <div class="card border-0 shadow-sm rounded-4">

            <div class="card-body">

              <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
                <h5 class="fw-bold text-primary mb-2 mb-md-0">
                  Service History
                </h5>

                <input type="text" class="form-control w-100 w-md-25 rounded-3" placeholder="Search...">
              </div>

              <div class="table-responsive">

                <table class="table table-hover table-bordered align-middle">

                  <thead class="table-primary text-nowrap">

                    <tr>
                      <th>#</th>
                      <th>Dealer</th>
                      <th>Customer</th>
                      <th>Service Person</th>
                      <th>Chasis/No</th>
                      <th>Problem</th>
                      <th>Date</th>
                    </tr>

                  </thead>

                  <tbody id="service_history_table">

                    <tr>
                      <td colspan="7" class="text-center text-muted py-4">
                        No Service Records Found
                      </td>
                    </tr>

                  </tbody>

                </table>

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>




  </div>





  <div id='footer' class="mt-auto"></div>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- jQuery UI -->
  <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

  <!-- SWAL FIRE -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- jQuery UI CSS -->

  <!-- bootstrap include -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
    crossorigin="anonymous"></script>

  <!-- font awesome -->
  <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

  <!-- Sweet alert -->
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- external js -->
  <script src="js/employee_service.js" type="module"></script>
  <script src="js/menu.js" type="module"></script>
  <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
