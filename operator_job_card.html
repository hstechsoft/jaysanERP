<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        table tr,
        th {
            font-size: 12px;
            vertical-align: middle;
            text-align: center;
        }

        .nesting_job_card_mobile .card {
            transition: 0.2s;
        }

        .nesting_job_card_mobile .card:hover {
            transform: scale(1.01);
        }

        .list-group-item{
            font-size: 12px;
        }

        button{
            font-size: 12px !important;
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="row">

                <div class="col-md-3">
                    <form class="p-4 border rounded-4 shadow-sm bg-light needs-validation" id="nesting_entry_form"
                        novalidate onsubmit="return false">

                        <div class="form-floating mb-3">
                            <select class="form-select" id="shift" required>
                                <option selected disabled value="">Choose...</option>
                                <option value="day">Day</option>
                                <option value="night">Night</option>
                            </select>
                            <label for="shift">Shift</label>
                            <div class="invalid-feedback">
                                Kindly Select Vaild
                            </div>
                        </div>

                        <div class="form-floating mb-3">
                            <select class="form-select" id="machine" required>
                                <option selected disabled value="">Choose...</option>
                            </select>
                            <label for="machine">Machine</label>
                            <div class="invalid-feedback">
                                Kindly Select Vaild
                            </div>
                        </div>

                        <div class="text-center">
                            <button type="button" class="btn btn-primary d-none" id="submit_btn">Submit</button>
                        </div>



                    </form>
                </div>

                <div class="col-md-9">


                    <div class="table-responsive d-none d-md-block" style="max-height: 80vh; overflow-y: auto;">
                        <table class="table caption-top table-bordered table-striped ">
                            <caption></caption>
                            <thead style="position: sticky; z-index: 5; top: 0; background-color: rgb(202, 222, 240);">
 
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Nesting Name</th>
                                    <th scope="col">Material</th>
                                    <th scope="col">Material Qty</th>
                                    <th scope="col">Process Time</th>
                                    <th scope="col">Employee</th>
                                    <th scope="col">Nested Parts</th>
                                    <th scope="col">Action</th>

                                </tr>
                            </thead>
                            <tbody id="operator_job_card_tbody">




                            </tbody>


                        </table>
                    </div>

                    <div class="operator_job_card_mobile d-md-none"></div>

                </div>

            </div>

        </div>




    </div>


    <!-- Modal -->
    <div class="modal fade" id="assignedWorkModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="staticBackdropLabel">Assing Work</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">


                    <div class="form-floating mb-2">
                        <input type="number" class="form-control rounded-3" min="1" id="scarp_weight" placeholder="" required>
                        <label for="scarp_weight">Scarp weight
                            <span class="text-danger">* In Kgs</span> </label>

                        <div class="invalid-feedback">
                            Kindly Enter Vaild Data
                        </div>
                    </div>

                    <div class="form-floating mb-2">
                        <input type="number" class="form-control rounded-3" min="1" id="scarp_qty" placeholder="" required>
                        <label for="scarp_qty">Scarp Qty
                            <span class="text-danger">*</span> </label>

                        <div class="invalid-feedback">
                            Kindly Enter Vaild Data
                        </div>
                    </div>

                    <div class="form-floating mb-2">
                        <input type="text" class="form-control rounded-3" id="remark" placeholder="">
                        <label for="remark">Remark </label>
                    </div>

                    <div id="nested_parts"></div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="assign_Work_entry_btn">Submit</button>
                </div>
            </div>
        </div>
    </div>


    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/operator_job_card.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
