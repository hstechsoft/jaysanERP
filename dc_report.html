<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        #input_godown_details_modal .card {
            border-radius: 10px;
        }

        #input_godown_details_modal .list-group-item {
            border: 0;
            border-bottom: 1px solid #ececec;
        }

        #input_godown_details_modal .list-group-item:last-child {
            border-bottom: 0;
        }

        #input_godown_details_modal .badge {
            font-size: .72rem;
        }

        #input_godown_details_modal .card-header {
            font-size: .9rem;
        }

        #input_godown_details_modal .modal-body {
            max-height: 65vh;
        }

        #input_godown_details_modal .list-group {
            max-height: 55vh;
            overflow-y: auto;
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">


            <div class="table-responsive">
                <table class="table caption-top table-bordered table-striped ">
                    <thead class="small">
                        <tr>
                            <th>#</th>
                            <th>Part & Process</th>
                            <th>Employee</th>
                            <th>Work Order No</th>
                            <th>Godown Details</th>
                            <th>Required Qty</th>
                            <th style="min-width:200px;">Input Details</th>
                            <th style="min-width:200px;">Total Input Summary</th>
                        </tr>
                    </thead>
                    <tbody class="small" id="dc_report_tbody">


                    </tbody>


                </table>
            </div>
        </div>



        <!-- Modal -->
        <div class="modal fade" id="input_godown_details_modal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content border-0 shadow">

                    <div class="modal-header bg-secondary text-white py-2">
                        <h6 class="modal-title fw-bold mb-0 text-center" id="input_godown_details_modalLabel"></h6>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body p-3">

                        <div class="row g-3">

                            <!-- Input Parts -->
                            <div class="col-lg-4">
                                <div class="card h-100 border-0 shadow-sm">
                                    <div class="card-header bg-light py-2 fw-semibold">
                                        <i class="fas fa-cubes text-primary me-1"></i>
                                        Input Parts
                                    </div>

                                    <div class="card-body p-2">
                                        <div id="input_details" class="list-group list-group-flush small"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Godown Details -->
                            <div class="col-lg-8">
                                <div class="card h-100 border-0 shadow-sm">
                                    <div class="card-header bg-light py-2 fw-semibold">
                                        <i class="fas fa-warehouse text-success me-1"></i>
                                        Godown Details
                                    </div>

                                    <div class="card-body p-2">
                                        <div id="godown_details" class="list-group list-group-flush small"></div>
                                    </div>
                                </div>
                            </div>

                        </div>

                    </div>

                    <div class="modal-footer py-2">
                        <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">
                            Close
                        </button>
                    </div>

                </div>
            </div>
        </div>

    </div>



    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- SWAL FIRE -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/dc_report.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
