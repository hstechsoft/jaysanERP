<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style1.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">

    <style>
        /* background */
        body {
            background: linear-gradient(160deg, #ff953d, #ffcf95);
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont;
        }

        /* wrapper */
        .welcome-wrapper-alt {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        /* glass card */
        .welcome-card-alt {
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            border-radius: 22px;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            animation: scaleIn 0.6s ease;
        }

        /* badge */
        .welcome-badge {
            display: inline-block;
            background: #eef4ff;
            color: #2575fc;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        /* title */
        .welcome-title-alt {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
            color: #111;
        }

        /* quote */
        .welcome-quote-alt {
            font-size: 15px;
            color: #444;
            line-height: 1.7;
            min-height: 48px;
        }

        /* button */
        .welcome-card-alt .btn {
            border-radius: 14px;
            font-size: 15px;
            padding: 12px;
        }

        /* animation */
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>

</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
        <section id="menu_bar"></section>
    <div class="container-fluid " style="height: 100%; overflow-y: auto;">
        <!-- top bar -->









        <div class="page-wrapper welcome-wrapper-alt">

            <div class="welcome-card-alt">
                <div class="welcome-badge">✨ Welcome</div>

                <h1 class="welcome-title-alt">
                    Jaysan
                </h1>

                <p class="welcome-quote-alt" id="quoteText">
                    Make today count.
                </p>

                <button class="btn btn-primary w-100 mt-3" id="start_btn">
                    Get Started →
                </button>
            </div>

        </div>




        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- jQuery UI -->
        <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

        <!-- jQuery UI CSS -->

        <!-- bootstrap include -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
            integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
            integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
            crossorigin="anonymous"></script>

        <!-- font awesome -->
        <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

        <!-- Sweet alert -->
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>


        <!-- external js -->
        <script src="js/welcome.js" type="module"></script>
        <script src="js/menu.js" type="module"></script>
        <!-- <script src="js/get_all_id.js" type="module"></script> -->


        <script>
            const quotes = [
                "Small steps today create big success tomorrow.",
                "Focus on progress, not perfection.",
                "Work smart. Stay consistent. Achieve more.",
                "Turn plans into progress, one task at a time.",
                "Success begins with showing up.",
                "Your effort today builds your future.",
                "Discipline turns goals into reality.",
                "Build better habits. Deliver better results.",
                "Every action moves you forward.",
                "Make today count.",
                "Consistency beats motivation.",
                "Do something today your future self will thank you for."
            ];

            document.getElementById("quoteText").textContent =
                quotes[Math.floor(Math.random() * quotes.length)];
        </script>



</body>

</html>
