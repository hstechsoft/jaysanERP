<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .dc-card {
            border-radius: 12px;
        }

        .location-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px;
        }

        .location-header {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }

        .part-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: white;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #eee;
        }

        .part-name {
            font-size: 14px;
            font-weight: 600;
        }

        .qty-badge {
            background: #0d6efd;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .accordion-item {
            border-radius: 10px;
            overflow: hidden;
        }

        .accordion-button {
            font-size: 0.9rem;
            background: #fff;
        }

        .accordion-button:not(.collapsed) {
            background: #f8f9fa;
            color: #212529;
        }

        .accordion-button:focus {
            box-shadow: none;
        }

        .accordion-button::after {
            width: 0.9rem;
            height: 0.9rem;
            background-size: 0.9rem;
        }

        .accordion-body {
            font-size: 0.9rem;
        }

        .badge {
            font-size: 0.75rem;
        }

        .border-bottom:last-child {
            border-bottom: none !important;
        }

        #manual_dc_tbody td {
            vertical-align: middle;
        }

        #manual_dc_tbody input[type="number"] {
            min-width: 80px;
        }

        .modal-body .badge {
            font-size: 11px;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(63, 63, 63, 0.4);
            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loading i {
            color: rgb(255, 148, 0);
            font-size: 3rem;
        }

        @media (max-width: 576px) {
            .accordion-button {
                padding: 0.75rem;
            }

            .accordion-body {
                padding: 0.75rem;
            }

            .badge {
                font-size: 0.7rem;
            }

            .btn-sm {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 576px) {

            .part-row {
                flex-direction: row;
                align-items: start;
                gap: 5px;
            }

            .qty-badge {
                align-self: flex-end;
            }
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="d-flex align-items-center gap-2 mb-2">
                <div class="form-floating flex-grow-1">
                    <input type="text" class="form-control form-control-sm rounded-3" id="godown" placeholder="">
                    <label for="godown">Godown</label>
                </div>

                <button type="button" class="btn btn-primary" id="save_map_btn">
                    <i class="fa fa-plus"></i>
                </button>
            </div>

            <div class="d-flex align-items-center gap-2 mb-2">
                <div class="form-floating flex-grow-1">
                    <input class="form-control dc_filess" type="file" id="dc_file_upload" disabled>
                </div>
                <button type="button" class="btn btn-secondary dc_filess" id="dc_file" disabled><i
                        class="fa-regular fa-camera fa-beat"></i></button>
            </div>

            <input type="hidden" class="form-control rounded-3" id="lat_input" placeholder="latitude">
            <input type="hidden" class="form-control rounded-3" id="lng_input" placeholder="longitude">

            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <h6 class="dc_title">DC Load Details</h6>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="dc_switch">
                        <label class="form-check-label" for="dc_switch">DC Unload Details</label>
                    </div>
                </div>

                <div class="card-body dc_details">

                </div>
            </div>

            <div class="loading d-none">
                <i class="fas fa-spinner fa-spin"></i>
            </div>

        </div>





    </div>


    <!-- Modal -->
    <div class="modal fade" id="manual_dc_modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="staticBackdropLabel">Create Manual DC</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-2">

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control form-control-sm rounded-3" id="dest_godown"
                            placeholder="" required>
                        <label for="dest_godown">
                            To Godown <span class="text-danger">*</span>
                        </label>
                        <div class="invalid-feedback">
                            Kindly Enter Valid Data
                        </div>
                    </div>

                    <div class="card mb-2 shadow-sm" id="manual_dc_card">

                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success add_manual_dc">Create</button>
                </div>
            </div>
        </div>
    </div>


    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- SWAL FIRE -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/driver_dc.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
