<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .process-chip {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: 0.2s ease;
        }

        .process-chip:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .process-arrow {
            margin: 0 6px;
            color: #6c757d;
            font-size: 12px;
        }

        /* Level Colors */
        .chip-model {
            background: #0267fb26;
            color: #b70dfd;
        }

        .chip-assembly {
            background: #ffc10725;
            color: #b88900;
        }

        .chip-part {
            background: #19875420;
            color: #198754;
        }

        .chip-default {
            background: #ffa29d5c;
            color: #ff4800;
        }

        thead th,
        tbody td,
        tbody td select,
        tbody td label {
            font-size: 12px !important;
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-3">

            <div class="d-flex justify-content-between">
                <div>
                    <input type="text" id="bom_correction_search" class="form-control border-0 bg-white "
                        placeholder="Search...">
                </div>
                <div>
                    <button class="btn btn-outline-info clear_btn"><i class="fa-solid fa-arrows-rotate"></i></button>
                </div>
            </div>
            <div class="table-responsive" style="height: 650px; overflow-y: auto;">

                <table class="table caption-top table-bordered table-striped ">

                    <thead>

                        <tr>
                            <th scope="col">#</th>
                            <th scope="col" class="d-flex">
                                <input type="text" class="form-control rounded-3" id="part_name"
                                    placeholder="Part name">
                                <select class='form-select form-control' id='bom_list_select'>
                                    <option disabled selected>Bom List</option>

                                </select>
                            </th>
                            <th scope="col">Map</th>
                            <th scope="col">Bom list</th>
                            <th scope="col">Action</th>

                        </tr>
                    </thead>
                    <tbody id="bom_correction_tbody">




                    </tbody>


                </table>
            </div>


            <div class="table-responsive d-none">
                <table class="table caption-top table-bordered table-striped ">
                    <caption></caption>
                    <thead>

                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Part Name</th>
                            <th scope="col">BOM List</th>
                            <th scope="col">Action</th>

                        </tr>
                    </thead>
                    <tbody id="duplicate_bom_tbody">


                    </tbody>


                </table>
            </div>


            <div class="table-responsive d-none">
                <table class="table caption-top table-bordered table-striped " id="bom_excel_table">
                    <caption></caption>
                    <thead>

                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Part Name</th>
                            <th scope="col">Input part / BOM List</th>
                            <th scope="col">Level <button type="button" class="btn btn-success float-end" id="excle"><i
                                        class="fa-solid fa-file-excel"></i></button></th>

                        </tr>
                    </thead>
                    <tbody id="sample_tbody">


                    </tbody>


                </table>
            </div>

        </div>




    </div>

    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <!-- excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- external js -->
    <script src="js/bom_correction.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
