<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <!-- bootsttrap icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
  <title>Document</title>

  <!-- external css -->
  <link rel="stylesheet" type="text/css" href="style.css">

  <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">




</head>

<body>
  <section id="menu_bar">

  </section>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header ">
        <strong class="me-auto toast-title">Toast Title</strong>
        <small class="text-muted">Just now</small>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body toast-description">
        Hello, this is a Bootstrap toast message!
      </div>
    </div>
  </div>
  <div class="container-fluid mb-2">
    <!-- top bar -->





    <!-- content -->
    <div class="page-wrapper">
      <div class="table-responsive">
        <table class="table caption-top table-bordered table-striped ">
          <div class="d-flex   justify-content-between  align-content-center">

            <div class="mx-3">
              <select class="form-select" id="sel_usr_in">

                <option selected value="" disabled>Select Employee...</option>

              </select>

            </div>

            <div class="mx-3">
              <select class="form-select" id="sel_cn_sts">

                <option selected value="" disabled>Select Status...</option>

              </select>

            </div>
          </div>
          <caption>Credit Note Tracker</caption>
          <thead>

            <tr>
              <th scope="col">#</th>
              <th scope="col">Customer</th>
              <th scope="col">Phone</th>
              <th scope="col">Invoice</th>

              <th scope="col">CN Amount </th>
              <th scope="col">Credit Note </th>
              <th scope="col">CN Dated</th>
              <th scope="col">Status</th>
              <th scope="col">Employee</th>
              <th scope="col">Action <button class="btn btn-outline-secondary border-0 float-end" id="combine_btn"><i
                    class="fa-solid fa-code-merge"></i></button></th>

            </tr>
          </thead>
          <tbody id="credit_note_report">


          </tbody>


        </table>
      </div>

    </div>
  </div>
  <div id='footer' class="mt-auto"></div>



  <!-- Modal -->
  <div class="modal fade" id="multiCNModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="staticBackdropLabel">Modal title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="table-responsive">
          <table class="small table caption-top table-bordered table-striped ">
              <caption></caption>
            <thead>
          
              <tr>
              <th scope="col">#</th>
              <th scope="col">Customer</th>
              <th scope="col">Phone</th>
              <th scope="col">Invoice</th>

              <th scope="col">CN Amount </th>
              <th scope="col">Credit Note </th>
              <th scope="col">CN Dated</th>
              <th scope="col">Status</th>
              <th scope="col">Employee</th>
              <th scope="col">Action</th>

            </tr>
            </thead>
            <tbody id="multiCNModal_tbody">
          
          
            </tbody>
          
          
          </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- jQuery UI -->
  <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

  <!-- jQuery UI CSS -->

  <!-- bootstrap include -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
    crossorigin="anonymous"></script>

  <!-- font awesome -->
  <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

  <!-- Sweet alert -->
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>


  <!-- external js -->
  <script src="js/credit_note_accounts.js" type="module"></script>
  <script src="js/menu.js" type="module"></script>
  <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
