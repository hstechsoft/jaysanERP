<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <!-- bootsttrap icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
  <title>Document</title>

  <!-- external css -->
  <link rel="stylesheet" type="text/css" href="style.css">

  <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


  <style>
    #summary_modal .modal-body {
      max-height: 70vh;
      overflow-y: auto;
    }

    #summary_modal .border {
      border-color: #e0e0e0 !important;
    }

    #summary_modal .fw-bold {
      font-size: 13px;
    }

    #summary_modal .text-muted {
      font-size: 11px;
    }

    #summary_modal .border-bottom:last-child {
      border-bottom: none !important;
    }

    #summary_modal .text-warning {
      color: #ff9800 !important;
    }

    .color_jay{
      background-color: #bee7ff !important;
    }
    .color_cus{
      background-color: #f1b99f !important;
    }
  </style>



</head>

<body>
  <section>

  </section>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header ">
        <strong class="me-auto toast-title">Toast Title</strong>
        <small class="text-muted">Just now</small>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body toast-description">
        Hello, this is a Bootstrap toast message!
      </div>
    </div>
  </div>
  <section id="menu_bar"></section>
  <div class="container-fluid mb-2">
    <!-- top bar -->


    <div class=" page-wrapper mt-5 mt-md-0">

      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">

        <!-- Button -->
        <button type="button" class="btn btn-primary btn-sm" id="excle_btn">
          <i class="fa fa-file-excel me-1"></i> Download Excel
        </button>

        <!-- Search -->
        <div class="input-group input-group-sm w-100 w-md-auto border border-primary rounded-2" style="max-width: 250px;">
          <span class="input-group-text bg-white border-0">
            <i class="fa fa-search text-muted"></i>
          </span>
          <input type="text" id="summary_search" class="form-control border-0 bg-white" placeholder="Search...">
        </div>

      </div>

      <div class="table-responsive">
        <table class="table caption-top table-bordered table-striped ">
          <caption>

          </caption>
          <thead>

            <tr>
              <th scope="col">#</th>
              <th scope="col" class="">
                customer name
              </th>
              <th scope="col">customer Phone/no</th>
              <th scope="col">Total Product Amount</th>
              <th scope="col">Total Spares Amount</th>
              <th scope="col">Total Paid</th>
              <th scope="col" class="color_jay">Balance Payment </th>
              <th scope="col">Tally Remaining Amount</th>
              <th scope="col">Summary</th>
            </tr>
          </thead>
          <tbody id="all_bom_table">
            <tr>

              <td></td>

            </tr>


          </tbody>


        </table>
      </div>
    </div>




  </div>



  <div class="modal fade" id="summary_modal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Customer Summary</h5>
          <button class="btn btn-sm btn-danger" data-bs-dismiss="modal">X</button>
        </div>

        <div class="modal-body" id="summary_content">
          <!-- dynamic content -->
        </div>

        <div class="modal-footer">
          <button class="btn btn-success" id="download_pdf">Download PDF</button>
        </div>

      </div>
    </div>
  </div>

  <div id='footer' class="mt-auto"></div>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- jQuery UI -->
  <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

  <!-- jQuery UI CSS -->

  <!-- bootstrap include -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
    crossorigin="anonymous"></script>

  <!-- font awesome -->
  <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

  <!-- Sweet alert -->
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- external js -->
  <script src="js/customer_summary.js" type="module"></script>
  <script src="js/menu.js" type="module"></script>
  <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
