<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        #parts_search {
            width: 130px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
        }

        #parts_list {
            max-height: 570px;
            overflow: auto;
        }

        #parts_list .list-group-item {
            border: none;
            border-bottom: 1px solid #f0f0f0;
            padding: 5px;
            font-size: 13px;
            cursor: pointer;
        }

        #parts_list .list-group-item:hover {
            background: #f8f9fa;
        }

        #parts_list .list-group-item {
            transition:
                background-color 0.35s ease,
                box-shadow 0.35s ease,
                transform 0.35s ease;
        }

        #parts_list .list-group-item:hover {
            background-color: #9ec1f5 !important;
            box-shadow: 13px 13px 20px 0px #3788ff !important;
            transform: translate(-6px, -6px);
        }

        @media(max-width:768px) {

            .row>div {
                margin-bottom: 10px;
            }

            .d-flex {
                flex-wrap: wrap;
            }

            #parts_search {
                width: 100%;
                margin-top: 8px;
            }

            .card {
                margin-bottom: 12px;
            }

        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="container-fluid py-2">

                <div class="row g-3">

                    <!-- Left Form Section -->
                    <div class="col-12 col-lg-3">

                        <div class="card shadow-sm border-0 rounded-4">

                            <div class="card-header bg-primary text-white py-2 rounded-top-4">
                                <h6 class="mb-0 text-center fw-bold">
                                    Purchase Master
                                </h6>
                            </div>

                            <div class="card-body p-3">

                                <!-- Part -->
                                <div class="d-flex gap-2 mb-3">

                                    <div class="form-floating flex-grow-1">
                                        <input type="text" class="form-control" id="part_name" placeholder="Part">
                                        <label for="part_name">Part</label>
                                    </div>

                                    <button class="btn btn-primary px-3" id="add_parts">
                                        <i class="fa fa-plus"></i>
                                    </button>

                                </div>

                                <div class="godown_section d-none">
                                    <!-- Godown -->
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="godown" placeholder="Godown">
                                        <label for="godown">Vendor</label>
                                    </div>

                                    <!-- Department -->
                                    <!-- <div class="form-floating mb-3">
                                        <select class="form-select" id="department_da">
                                            <option selected disabled value="">Choose...</option>
                                        </select>
                                        <label for="department_da">Department</label>
                                    </div> -->


                                    <!-- Section -->
                                    <!-- <div class="form-floating mb-3">
                                        <select class="form-select" id="section_da">
                                            <option selected disabled value="">Choose...</option>
                                        </select>
                                        <label for="section_da">Section</label>
                                    </div> -->

                                    <!-- Machine -->
                                    <!-- <div class="form-floating mb-3">
                                        <select class="form-select" id="machine_da">
                                            <option selected disabled value="">Choose...</option>
                                        </select>
                                        <label for="machine_da">Machine</label>
                                    </div> -->

                                    <!-- Time Inputs -->
                                    <div class="row g-2">

                                        <div class="col-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="min_time"
                                                    placeholder="Min Time">
                                                <label for="min_time">
                                                    Min Time
                                                </label>
                                            </div>
                                        </div>

                                        <div class="col-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="max_time"
                                                    placeholder="Max Time">
                                                <label for="max_time">
                                                    Max Time
                                                </label>
                                            </div>
                                        </div>

                                    </div>

                                    <!-- Ubit -->
                                    <div class="form-floating mb-3">
                                        <select class="form-select" id="unit">
                                            <option selected value="hrs">Hrs</option>
                                            <option value="mins">Mins</option>
                                            <option value="days">Days</option>
                                        </select>
                                        <label for="unit">Time In</label>
                                    </div>

                                    <!-- Cost -->
                                    <div class="form-floating mt-3 mb-3">
                                        <input type="text" class="form-control" id="cost" value="0" placeholder="Cost">

                                        <label for="cost">Cost</label>
                                    </div>

                                    <!-- Checkbox -->
                                    <div class="form-check form-switch mb-3">

                                        <input class="form-check-input" type="checkbox" id="is_default">

                                        <label class="form-check-label" for="is_default">
                                            Is Default
                                        </label>

                                    </div>

                                    <!-- Buttons -->
                                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">

                                        <button type="button" class="btn btn-warning px-4 form_godown_update_btn">
                                            Update
                                        </button>

                                    </div>
                                </div>
                            </div>

                        </div>

                    </div>

                    <!-- Right Section -->
                    <div class="col-12 col-lg-6">

                        <div class="card shadow-sm border-0 rounded-4 h-100">

                            <div class="card-body">

                                <div class="text-center text-muted">
                                    <div class="table-responsive">
                                        <table class="table table-sm caption-top table-bordered table-striped mb-0">
                                            <caption></caption>
                                            <thead class="">
                                                <tr>
                                                    <th scope="col">#</th>
                                                    <th scope="col">Godown</th>
                                                    <th scope="col">Mini Time</th>
                                                    <th scope="col">Max Time</th>
                                                    <th scope="col">Cost</th>
                                                    <th scope="col">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody class="" id="godown_tbody">

                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card">
                            <div class="card-header">
                                <div class="d-flex justify-content-between">
                                    <h6 class="text-center">Parts  <span class="badge bg-success blink" id="part_count"></span></h6>
                                    <input type="text" name="" id="parts_search" placeholder="Search">
                                </div>
                            </div>
                            <div class="card-body">
                                <ul class="list-group" id="parts_list">

                                </ul>
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>




    </div>



    <div class="modal fade" id="summary_modal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Customer Summary</h5>
                    <button class="btn btn-sm btn-danger" data-bs-dismiss="modal">X</button>
                </div>

                <div class="modal-body" id="summary_content">
                    <!-- dynamic content -->
                </div>

                <div class="modal-footer">
                    <button class="btn btn-success" id="download_pdf">Download PDF</button>
                </div>

            </div>
        </div>
    </div>

    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/purchase_master.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
