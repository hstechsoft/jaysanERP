<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>

    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="row">
                <h6 class="text-center">Purchase Master</h6>

                <div class="col-md-3">
                    <div class="d-flex">
                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" id="part_name" placeholder="">
                            <label for="part_name">Part </label>
                        </div>
                        <div class="text-center">
                            <button class="btn  btn-primary" id="add_parts">Add</button>
                        </div>
                    </div>
<div class="card">
                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control rounded-3" id="godown" placeholder="">
                                    <label for="godown">Godown </label>
                                </div>

                                <div class="input-group mb-3">
                                    <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                                        data-bs-toggle="dropdown" aria-expanded="false">Department</button>
                                    <ul class="dropdown-menu" id="department_da">
                                    </ul>
                                    <input type="text" class="form-control" aria-label="Text input with dropdown button"
                                        id="department">
                                    <button type="submit" class="btn btn-primary d-none" id="department_add_btn"><i
                                            class="fa fa-plus"></i></button>
                                </div>
                            </div>
                            <div class="col-12">

                                <div class="input-group mb-3">
                                    <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                                        data-bs-toggle="dropdown" aria-expanded="false">Section</button>
                                    <ul class="dropdown-menu" id="section_da">
                                    </ul>
                                    <input type="text" class="form-control" aria-label="Text input with dropdown button"
                                        id="section">
                                    <button type="submit" class="btn btn-primary d-none" id="section_add_btn"><i
                                            class="fa fa-plus"></i></button>
                                </div>
                            </div>
                            <div class="col-12">

                                <div class="input-group mb-3">
                                    <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                                        data-bs-toggle="dropdown" aria-expanded="false">Machine</button>
                                    <ul class="dropdown-menu" id="machine_da">
                                    </ul>
                                    <input type="text" class="form-control" aria-label="Text input with dropdown button"
                                        id="machine">
                                    <button type="submit" class="btn btn-primary d-none" id="machine_add_btn"><i
                                            class="fa fa-plus"></i></button>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control rounded-3" id="min_time" placeholder="">
                                    <label for="min_time">Min Time
                                        <span class="text-danger">in Mins*</span> </label>

                                    <div class="invalid-feedback">
                                        Kindly Enter Vaild Data
                                    </div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control rounded-3" id="max_time" placeholder="">
                                    <label for="max_time">Max Time
                                        <span class="text-danger">in Mins*</span> </label>

                                    <div class="invalid-feedback">
                                        Kindly Enter Vaild Data
                                    </div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control rounded-3" id="cost" value="0"
                                        placeholder="">
                                    <label for="cost">Cost
                                        <span class="text-danger">*</span> </label>

                                    <div class="invalid-feedback">
                                        Kindly Enter Vaild Data
                                    </div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check mb-3">
                                    <input class="form-check-input " type="checkbox" value="" id="is_default"
                                        style="height: 20px;">
                                    <label class="form-check-label" for="is_default">
                                        Is Default?
                                    </label>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="submit" id="" class="btn btn-primary form_godown_btn">Add</button>
                                <button type="submit" id=""
                                    class="btn btn-warning form_godown_update_btn d-none">Update</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>




    </div>



    <div class="modal fade" id="summary_modal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Customer Summary</h5>
                    <button class="btn btn-sm btn-danger" data-bs-dismiss="modal">X</button>
                </div>

                <div class="modal-body" id="summary_content">
                    <!-- dynamic content -->
                </div>

                <div class="modal-footer">
                    <button class="btn btn-success" id="download_pdf">Download PDF</button>
                </div>

            </div>
        </div>
    </div>

    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/purchase_master.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
